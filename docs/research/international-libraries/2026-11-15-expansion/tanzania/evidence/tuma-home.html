    function GetXmlHttpRequest() {
        var xmlhttp = null;
        if (window.XMLHttpRequest) {// code for IE7+, Firefox, Chrome, Opera, Safari

        }

                var xmlHttpRequest = GetXmlHttpRequest();
                if (xmlHttpRequest == null) {
                    //alert('denied');
                    return;

                var cmd = '?q=' + request.term;

                    }
                }
            },
            select: function (event, ui)  {
                autocompleteDropdownClicked = true;
            }
        });


    });

    function ajaxGetObject(id) {
        var obj = document.getElementById(id);
        if (obj == null) {
            obj = document.all(id);
        }
        return obj;
    }

    function ajaxText_Changed(id, command, target) {
        var xmlHttpRequest = GetXmlHttpRequest();
        if (xmlHttpRequest == null) {
            return;
        }
        xmlHttpRequest.onreadystatechange = function () {
            if (xmlHttpRequest.readyState == 4 && xmlHttpRequest.status == 200) {
                return;            }
        } // end of onreadystatechange

        var text = "";
        var obj = ajaxGetObject(id);
        if (obj != null) {
            text = obj.value;
        }
        var args = "";
        args += target;
        args += '/' + text;
        var cmd = "&__EVENTTARGET=" + command + "&__EVENTARGUMENT=" + args;
        xmlHttpRequest.open("POST", "Default.aspx?" + cmd, true);
        xmlHttpRequest.send(id);
    }

</script>

    function CopyToClipboard(text) {
        var hidden = null;

        if (document.all) {
            hidden = document.all("forclipboard");
        }

        if (!hidden)
            if (document.getElementById) {
                hidden = document.getElementById("forclipboard");
            }
        if (!hidden)
            if (document.layers) {
                hidden = document.layers("forclipboard");
            }


        if (hidden) {
            var startCharNo = 0;
            var endCharNo = text.length;
            if (hidden.setSelectionRange)
                hidden.setSelectionRange(startCharNo, endCharNo);
            else {
                var copiedText = hidden.createTextRange();
                copiedText.select(text);
                copiedText.execCommand("Copy");
            }
        }
    }
