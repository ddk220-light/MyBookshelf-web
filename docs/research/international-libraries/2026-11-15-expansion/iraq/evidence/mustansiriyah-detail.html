<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus - المكتبة المركزية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Scheherazade New", serif;
            background: linear-gradient(135deg, #f5f6fa 0%, #ebe8de 100%);
            min-height: 100vh;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(85vw, 950px);
            height: min(85vw, 950px);
            transform: translate(-50%, -50%);
            background-image: url("/logomus.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.035;
            pointer-events: none;
            z-index: 0;
        }

        body > * { position: relative; z-index: 1; }

        /* ===== Topbar ===== */
        .topbar {
            background: linear-gradient(135deg, #c8a415, #a68b00);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(168,139,0,0.25);
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar-brand {
            display: flex; align-items: center; gap: 12px;
            color: #fff; text-decoration: none;
        }

        .topbar-brand img {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            padding: 4px;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .topbar-brand-text { font-size: 19px; font-weight: 700; }
        .topbar-brand-sub { font-size: 13px; opacity: 0.85; }

        .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .btn-back {
            color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.18);
            padding: 8px 18px;
            border-radius: 22px;
            font-size: 15px; font-weight: 600;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-back:hover { background: rgba(255,255,255,0.32); }

        /* ===== Layout ===== */
        .main-wrap {
            max-width: 1180px;
            margin: 50px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 50px;
            align-items: flex-start;
            flex: 1;
        }

        /* ===== Book Cover ===== */
        .book-stage {
            perspective: 1700px;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .book {
            width: 300px;
            height: 440px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-22deg) rotateX(3deg);
            transition: transform 0.6s ease;
            animation: bookEnter 1s cubic-bezier(.2,.7,.3,1) both;
        }

        .book:hover { transform: rotateY(-12deg) rotateX(2deg); }

        @keyframes bookEnter {
            0% { transform: rotateY(-90deg) rotateX(15deg); opacity: 0; }
            100% { transform: rotateY(-22deg) rotateX(3deg); opacity: 1; }
        }

        .book-cover {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 18%, rgba(255,255,255,0.18), transparent 60%),
                linear-gradient(135deg, #d4af37 0%, #b8870e 50%, #8b6508 100%);
            border-radius: 6px 14px 14px 6px;
            box-shadow:
                0 30px 60px -15px rgba(0,0,0,0.45),
                inset 0 0 80px rgba(0,0,0,0.18);
            padding: 22px 20px 18px;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .book-cover::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        .book-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("/logomus.png");
            background-size: 70% auto;
            background-repeat: no-repeat;
            background-position: center 50%;
            opacity: 0.08;
            pointer-events: none;
        }

        .book-spine {
            position: absolute;
            top: 0; right: 100%;
            width: 32px; height: 100%;
            background: linear-gradient(90deg, #6b4f06 0%, #8b6508 50%, #6b4f06 100%);
            transform-origin: right;
            transform: rotateY(90deg);
            border-radius: 6px 0 0 6px;
            box-shadow: inset -3px 0 8px rgba(0,0,0,0.5);
        }

        .book-spine::before, .book-spine::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 6px;
            background: rgba(255,255,255,0.18);
        }
        .book-spine::before { top: 18px; }
        .book-spine::after { bottom: 18px; }

        .book-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #8b6508 0%, #5d4204 100%);
            border-radius: 6px 14px 14px 6px;
            transform: translateZ(-32px);
        }

        .book-pages {
            position: absolute;
            top: 4px; bottom: 4px;
            right: -2px; width: 6px;
            background: repeating-linear-gradient(
                to bottom,
                #fffbe6 0px, #fffbe6 2px,
                #d4cfb0 2px, #d4cfb0 3px
            );
            border-radius: 0 4px 4px 0;
            transform: translateZ(-16px);
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
        }

        .book-shadow {
            position: absolute;
            bottom: -50px;
            left: 10%; right: 10%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), transparent 70%);
            filter: blur(8px);
            transform: translateZ(-50px);
        }

        /* === العلامة العلوية (تصنيف الكتاب) === */
        .cover-classification {
            position: relative;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
            padding: 2px 0 6px;
            border-bottom: 1px solid rgba(255,255,255,0.25);
            margin-bottom: 22px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* === منطقة العنوان === */
        .cover-title-block {
            position: relative;
            text-align: center;
            margin-top: 6px;
        }

        .cover-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.45);
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            padding: 0 6px;
        }

        /* === زخرفة (Flourish) === */
        .cover-flourish {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 18px auto;
            color: rgba(255,255,255,0.7);
        }

        .cover-flourish::before, .cover-flourish::after {
            content: '';
            flex: 1;
            max-width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6));
        }

        .cover-flourish::after {
            background: linear-gradient(90deg, rgba(255,255,255,0.6), transparent);
        }

        .cover-flourish i { font-size: 11px; opacity: 0.85; }

        /* === اسم المؤلف === */
        .cover-author-block {
            position: relative;
            text-align: center;
            margin-bottom: auto;
        }

        .cover-author-label {
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.65);
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .cover-author {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            line-height: 1.4;
            padding: 0 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* === معلومات إضافية (السنة + الشهادة) === */
        .cover-meta {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .cover-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.95);
            background: rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
        }

        .cover-meta-pill i { font-size: 10px; opacity: 0.85; }

        /* === التذييل: شعار الجامعة + اسمها === */
        .cover-footer {
            position: relative;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .cover-footer-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.35);
        }

        .cover-footer-name {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.95);
            text-align: center;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .cover-footer-sub {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ===== Details Panel ===== */
        .details-panel {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        .details-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("/logomus.png");
            background-size: 50% auto;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.04;
            pointer-events: none;
        }

        .details-panel > * { position: relative; }

        .details-header {
            padding: 26px 28px 22px;
            border-bottom: 1px solid #efeadb;
        }

        .details-title {
            font-size: 24px; font-weight: 700;
            color: #2c3e50;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .details-subtitle {
            color: #8b7000;
            font-size: 16px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .details-subtitle i { font-size: 17px; }

        .details-body {
            padding: 26px 28px 30px;
        }

        .empty-state {
            text-align: center;
            color: #b0b0b0;
            font-size: 16px;
            padding: 40px 20px;
        }
        .empty-state i {
            font-size: 38px; color: #e0e0e0;
            margin-bottom: 10px; display: block;
        }

        .field-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .field-card {
            background: #fafafa;
            border: 1px solid #f0ecdf;
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.25s ease;
        }

        .field-card:hover {
            background: #fffbe6;
            border-color: #e8dca8;
        }

        .field-label {
            font-size: 13px;
            color: #8b8b8b;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .field-value {
            font-size: 17px;
            color: #2c3e50;
            font-weight: 600;
            word-break: break-word;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 22px 20px;
            background: #1a1a2e;
            color: rgba(255,255,255,0.7);
            margin-top: auto;
        }

        .footer-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; flex-wrap: wrap;
        }

        .footer-logo { width: 36px; height: 36px; border-radius: 50%; }
        .footer span { font-size: 14px; font-weight: 500; }

        @media (max-width: 900px) {
            .main-wrap {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 30px auto;
            }
            .book { width: 260px; height: 380px; }
            .cover-title { font-size: 17px; }
        }

        @media (max-width: 600px) {
            .topbar { padding: 12px 14px; }
            .topbar-brand-text { font-size: 16px; }
            .topbar-brand-sub { display: none; }
            .details-header, .details-body { padding-left: 18px; padding-right: 18px; }
            .details-title { font-size: 19px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <a href="https://libraryapp.uomustansiriyah.edu.iq/search" class="topbar-brand">
            <img src="/logomus.png" alt="شعار الجامعة المستنصرية">
            <div>
                <div class="topbar-brand-text">المكتبة المركزية</div>
                <div class="topbar-brand-sub">الجامعة المستنصرية</div>
            </div>
        </a>
        <div class="topbar-actions">
            <a href="https://libraryapp.uomustansiriyah.edu.iq" class="btn-back">
                <i class="fas fa-arrow-right"></i> رجوع
            </a>
            <a href="https://libraryapp.uomustansiriyah.edu.iq/search" class="btn-back">
                <i class="fas fa-search"></i> بحث جديد
            </a>
        </div>
    </header>

    <main class="main-wrap">

        <div class="book-stage">
            <div class="book">
                <div class="book-back"></div>
                <div class="book-pages"></div>
                <div class="book-spine"></div>
                
                <div class="book-cover">
                    <div class="cover-classification">الإعارة</div>

                    <div class="cover-title-block">
                        <h2 class="cover-title">Calculus</h2>
                    </div>

                    <div class="cover-flourish">
                        <i class="fas fa-star"></i>
                    </div>

                                            <div class="cover-author-block">
                            <div class="cover-author-label">تأليف</div>
                            <div class="cover-author">Lester E.Ford</div>

                                                            <div class="cover-meta">
                                                                                                                <span class="cover-meta-pill"><i class="fas fa-calendar"></i> 1963</span>
                                                                    </div>
                                                    </div>
                    
                    <div class="cover-footer">
                        <img src="/logomus.png" alt="شعار الجامعة" class="cover-footer-logo">
                        <div class="cover-footer-name">
                                                            المكتبة المركزية
                                                    </div>
                        <div class="cover-footer-sub">الجامعة المستنصرية</div>
                    </div>
                </div>
                <div class="book-shadow"></div>
            </div>
        </div>

        <section class="details-panel">
            <div class="details-header">
                <h1 class="details-title">Calculus</h1>
                <div class="details-subtitle">
                    <i class="fas fa-hand-holding"></i>
                    الإعارة
                </div>
            </div>

            <div class="details-body">
                                    <div class="field-cards">
                                                    <div class="field-card">
                                <div class="field-label">المؤلف</div>
                                <div class="field-value">Lester E.Ford</div>
                            </div>
                                                    <div class="field-card">
                                <div class="field-label">سنة النشر</div>
                                <div class="field-value">1963</div>
                            </div>
                                                    <div class="field-card">
                                <div class="field-label">الواصفات</div>
                                <div class="field-value">Algebra</div>
                            </div>
                                                    <div class="field-card">
                                <div class="field-label">رقم التسلسل</div>
                                <div class="field-value">5/4159</div>
                            </div>
                                            </div>
                            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-content">
            <img src="/logomus.png" alt="شعار الجامعة" class="footer-logo">
            <span>المكتبة المركزية - الجامعة المستنصرية &copy; 2026</span>
        </div>
    </footer>

</body>
</html>
