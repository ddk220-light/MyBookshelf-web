<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik Doğrulaması - Boğaziçi Üniversitesi Kütüphanesi</title>
    <!-- Turnstile JS -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .kutu {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .turnstile-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 28px;
            font-size: 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #004494; }
        .hata {
            color: red;
            font-weight: bold;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="kutu">
        <h2>Güvenlik Kontrolü</h2>
        <p>Devam etmek için lütfen aşağıdaki doğrulamayı tamamlayın.</p>
        <form method="POST">
            <input type="hidden" name="url" value="/robots.txt">

            <div class="turnstile-wrapper">
                <div class="cf-turnstile"
                     data-sitekey="0x4AAAAAADE2ypa5QtU2wl1h"
                     data-theme="light"
                     data-language="tr">
                </div>
            </div>

            <button type="submit">Doğrula ve Devam Et</button>

                    </form>
    </div>
</body>
</html>
