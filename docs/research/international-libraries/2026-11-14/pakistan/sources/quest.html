
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | QUEST Nawabshah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/secure_dashboard/css/dashboard_styles.css">
    <link rel="shortcut icon" href="/static/images/logo/logo-color-filled.png" type="image/x-icon" />

    <style>
        body, html {
            height: 100%;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            text-align: center;
            padding: 3rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #dc3545; /* Red for errors */
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #343a40;
        }
        .error-text {
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .btn-home {
            padding: 0.75rem 2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <img src="/static/images/logo/logo-color.png" alt="QUEST Logo" style="width: 300px; margin-bottom: 20px;">
        
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-text">
            We couldn't find the page you were looking for. It might have been removed, renamed, or doesn't exist.
        </p>

        <a href="/" class="btn btn-primary btn-home">
            <i class="bi bi-house-fill me-2"></i> Return Home
        </a>
        <div class="mt-3">
            <a href="javascript:history.back()" class="text-decoration-none text-muted small">
                &larr; Go Back
            </a>
        </div>
    </div>

</body>
</html>
