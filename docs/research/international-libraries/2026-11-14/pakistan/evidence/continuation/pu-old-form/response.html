		    function formValidation1(formObj) {


		        if (!removeSpace(formObj.Editor.value)) {
		            alert("Please enter search text.");
		            formObj.Editor.focus();
		            return false;
		        }


		        return true;
		    }

		    function removeSpace(field) {
		        var rRes = "";
		        for (i = 0; i < field.length; i++) {
		            if (field.charAt(i) != ' ') {
		                rRes = rRes + field.charAt(i);
		            }
		        }
		        if (rRes == "")
		            return (false);
		        return (true);
		    }
		    function removeSpaced(field) {
		        var rRes = "<?=$_SESSION['captcha_id']?>";

		        if (rRes == field)

		        return (false);
		    }

		        if (/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/.test(myForm.Email_Address.value)) {
		            return (true)
		        }
		        alert("Invalid E-mail Address! Please re-enter.")
		        return (false)
		    }
