<div id="loginForm">
	<form class="loginForm lightBorder">
		<div id="loginErrorMessage" class="errorGradient" style="display: none;">
			The credentials entered are incorrect.
		</div>
	
		<div id="localLogin" class="narrow-column-form">

    <p>Log in with either your Library Card Number or EZ Login</p>

    
        <p class="loginMessage">
                Welcome to Ateneo de Davao University Online Public Access Catalog (OPAC)
        </p>
    

    <div class="form-row">
        <label for="barcode">Library Card Number or EZ Username <span aria-hidden="true">*</span></label>
        <input autocapitalize="off"
            autocorrect="off"
            type="text"
            name="barcode"
            aria-describedby="barcode_error"
            aria-invalid="false"
            aria-required="true"
            id="barcode"/>
        <span role="alert" id="barcode_error"></span>
    </div>

    
    
        
            
            <div class="form-row">
                <label for="pin">PIN or EZ Password <span aria-hidden="true">*</span></label>
                <input type="password"
                        name="pin"
                        aria-required="true"
                        aria-invalid="false"
                        aria-describedby="pin_error"
                        id="pin" />
                <span role="alert" id="pin_error"></span>
                
                
                <div id="loginFormForgotPassword"></div>
            </div>
            
            
        
    

    <div class="checkbox-form-row" id="rememberMeContainer">
        <input type="checkbox"
               data-role="none"
               name="rememberMe" 
               id="rememberMe" />
        <label class="clickableFormText" for="rememberMe">Remember Me</label>
    </div>

    <div class="loginSubmitButton">
        
            

            
                <input class="darkButton" type="submit" value="Log In" id="submitLoginFormButton"/>
                <input class="lightButton loginCloseButton" type="button" value="Cancel" />
            
        
    </div>

    
        <div class="text-divider"><span>or</span></div>

        <div id="accountNotLinkedErrorMessage" style="display: none;">
            <span id="googleAccountEmail"></span>
            <input type="hidden" name="linkGoogleAccount" id="linkGoogleAccount" value="false" />
        </div>
    
        <div id="googleSignInBtnDiv" style="text-align:center;">
            <div>
                <button type="button"
                        data-role="none" 
                        class="googleSignInBtn" 
                        onclick="location.href='/oauth2/callback'" 
                        aria-label="Sign in with Google"></button>
            </div>
        </div>
    

    

</div>
