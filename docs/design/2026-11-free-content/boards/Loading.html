<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Searching sources</title>
<style>@font-face{font-family:Newsreader;src:url("../../../../client/public-app/fonts/Newsreader.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
body{margin:0}
[data-light]{--bg:#faf7f1;--surface:#fff;--fill:#efe9df;--ink:#1f1a17;--ink2:#4a423b;--ink3:#6b6259;--line:#e7e0d5;--accent:#2f5340;--on:#fff;--bar:rgba(250,247,241,.96);--ok:#2f7a4b;--chk:#9a6200;--ref:#6b4fa0;--err:#b42318;--placeholder:#e9e1d3;--covershadow:rgba(31,26,23,.28);--hero:#ece3d3}
[data-light="lamplight"]{--bg:#15120f;--surface:#1f1b17;--fill:#2b2621;--ink:#f1e9dc;--ink2:#d3c8b8;--ink3:#a89d8c;--line:#463d33;--accent:#9fd0ae;--on:#10261a;--bar:rgba(21,18,15,.96);--ok:#7fcf98;--chk:#e8b45a;--ref:#c2aef0;--err:#f28b82;--placeholder:#2b2621;--covershadow:rgba(0,0,0,.6);--hero:#231e19}
[data-light="ink"]{--bg:#f6f7f9;--surface:#fff;--fill:#e9edf2;--ink:#101828;--ink2:#344054;--ink3:#5a6474;--line:#dde2e9;--accent:#1d4f91;--on:#fff;--bar:rgba(246,247,249,.96);--ok:#13784a;--chk:#9a5b00;--ref:#6b3fc4;--err:#b42318;--placeholder:#e9edf2;--covershadow:rgba(16,24,40,.25);--hero:#e6ebf1}
a{color:var(--accent)}a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Proposal board for free-content discovery. Sample records; links to hosts are inert. See ../README.md. -->
<div data-light="daylight" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <header style="display: flex; flex-direction: column; gap: 10px; padding: 44px 16px 6px">
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 40px">Search</h1>
    <label style="position: relative; display: flex; align-items: center">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Title, author, DOI or arXiv ID</span>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="stroke: var(--ink3); position: absolute; left: 12px"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>
      <input type="search" value="protein folding" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 16px 0 38px; border: 0; border-radius: 12px; background: var(--fill); font: 17px system-ui, -apple-system, sans-serif; color: var(--ink)">
    </label>
    <div role="group" aria-label="Search in" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px; border-radius: 10px; background: var(--fill)">
      <button type="button" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font: 500 14px system-ui, sans-serif">Library books</button>
      <button type="button" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font: 500 14px system-ui, sans-serif">Free to read</button>
      <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 14px system-ui, sans-serif; box-shadow: 0 0 0 1px var(--line), 0 1px 3px var(--covershadow)">Papers</button>
    </div>
  </header>

  <section role="status" aria-label="Searching" style="display: flex; flex-direction: column; gap: 2px; margin: 8px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--fill)">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ok)"><path d="M3.5 8.5l3 3 6-7"></path></svg>OpenAlex<span style="margin-left: auto; color: var(--ink3)">12 found</span></div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color: var(--ink3)"><circle cx="8" cy="8" r="5.5" stroke-dasharray="3 2.4"></circle></svg>Europe PMC<span style="margin-left: auto; color: var(--ink3)">Searching…</span></div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--ink3)"><path d="M4 8h8"></path></svg>arXiv<span style="margin-left: auto; color: var(--ink3)">Waiting its turn</span></div>
  </section>
  <p style="margin: 8px 16px 0; font-size: 13px; color: var(--ink3)">Results appear as each source answers. We stop waiting after 5 seconds.</p>

  <ul aria-hidden="true" style="margin: 6px 0 0; padding: 0; list-style: none">
    <li style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><span style="width: 92px; height: 18px; border-radius: 6px; background: var(--fill)"></span><span style="width: 90%; height: 18px; border-radius: 4px; background: var(--fill)"></span><span style="width: 70%; height: 18px; border-radius: 4px; background: var(--fill)"></span><span style="width: 45%; height: 14px; border-radius: 4px; background: var(--fill)"></span></li>
    <li style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><span style="width: 92px; height: 18px; border-radius: 6px; background: var(--fill)"></span><span style="width: 84%; height: 18px; border-radius: 4px; background: var(--fill)"></span><span style="width: 60%; height: 18px; border-radius: 4px; background: var(--fill)"></span><span style="width: 50%; height: 14px; border-radius: 4px; background: var(--fill)"></span></li>
    <li style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px"><span style="width: 92px; height: 18px; border-radius: 6px; background: var(--fill)"></span><span style="width: 88%; height: 18px; border-radius: 4px; background: var(--fill)"></span><span style="width: 40%; height: 14px; border-radius: 4px; background: var(--fill)"></span></li>
  </ul>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: var(--bar); border-top: 1px solid var(--line)">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--ink3); font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5h3v15h-3zM7.5 3.5h3v15h-3zM12 4.6l2.9-.8 3.9 14.5-2.9.8z"></path></svg>Shelf</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--accent); font-weight: 600; font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>Search</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--ink3); font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l8-4.5L19 8M4.5 8v8.5M8.5 8v8.5M13.5 8v8.5M17.5 8v8.5M3 18.5h16"></path></svg>Libraries</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--ink3); font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="3"></circle><path d="M11 2.5v2.5M11 17v2.5M2.5 11H5M17 11h2.5M5 5l1.8 1.8M15.2 15.2 17 17M5 17l1.8-1.8M15.2 6.8 17 5"></path></svg>Settings</a>
  </nav>
</div>
<script>
/* Reading light: ?light=daylight|lamplight|ink. Boards default to Daylight. */
(function(){var l=new URLSearchParams(location.search).get('light');if(!/^(daylight|lamplight|ink)$/.test(l||''))l='daylight';
document.querySelectorAll('[data-light]').forEach(function(e){e.setAttribute('data-light',l)});
document.querySelectorAll('a[href$=".html"]').forEach(function(a){if(l!=='daylight')a.href=a.getAttribute('href')+'?light='+l});
document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener('click',function(ev){ev.preventDefault()})});})();
</script>
</body>
</html>
