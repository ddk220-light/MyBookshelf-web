<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop first open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5340}a:hover{color:#1f3a2c}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; background: #faf7f1; color: #1f1a17; font-family: 'Work Sans', sans-serif; font-size: 15px; line-height: 1.5; overflow: hidden">

<aside aria-label="Library and account" style="flex: 0 0 300px; width: 300px; box-sizing: border-box; height: 900px; background: #f3ede2; border-right: 1px solid #e2d9ca; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 30px">
<div style="font-family: Newsreader, serif; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1">MyBookshelf</div>

<section aria-labelledby="lib-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="lib-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">My library</h2>
<a href="DeskLibrary.dc.html" style="height: 48px; border: 1px solid #2f5340; border-radius: 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.200 7-11a7 7 0 10-14 0c0 4.800 7 11 7 11z"></path><circle cx="12" cy="10" r="2.500"></circle></svg>
Find my library
</a>
</section>

<section aria-labelledby="acct-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="acct-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">Account</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="#" style="height: 44px; border-radius: 12px; background: #2f5340; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Create account</a>
<a href="#" style="height: 44px; border: 1px solid #2f5340; border-radius: 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Log in</a>
</div>
</section>

<section aria-labelledby="light-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="light-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">Reading light</h2>
<div role="group" aria-labelledby="light-h" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #d6cdbf; border-radius: 10px; overflow: hidden; background: #ffffff">
<button aria-pressed="true" style="height: 44px; border: 0; background: #e3ecdf; color: #1f3a2c; font: inherit; font-size: 13px; font-weight: 600">Daylight</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-left: 1px solid #d6cdbf; background: #ffffff; color: #4a423b; font: inherit; font-size: 13px">Lamplight</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-left: 1px solid #d6cdbf; background: #ffffff; color: #4a423b; font: inherit; font-size: 13px">Ink</button>
</div>
</section>

<nav aria-label="Help" style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px">
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">Report a problem</a>
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">Privacy</a>
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">About</a>
</nav>
</aside>

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 900px; padding: 24px 40px 0; display: flex; flex-direction: column; overflow: hidden">
<div style="max-width: 680px; height: 52px; display: flex; align-items: center; background: #ffffff; border: 1px solid #cfc6b8; border-radius: 14px; box-sizing: border-box">
<a href="DeskResults.dc.html" style="flex-grow: 1; height: 50px; padding-left: 16px; display: flex; align-items: center; gap: 10px; color: #6b6259; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.500-3.500"></path></svg>
Title, author or ISBN
</a>
<button aria-label="Scan a barcode" style="flex-shrink: 0; width: 56px; height: 50px; border: 0; border-left: 1px solid #e7e0d5; background: transparent; color: #2f5340; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h3M17 5h3v2M4 17v2h3M17 19h3v-2M8 9v6M10.500 9v6M13.500 9v6M16 9v6"></path></svg>
</button>
</div>

<div style="margin: 64px auto 40px; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 500; font-size: 44px; line-height: 1.1; letter-spacing: -0.025em">Ready to search</h1>
<p style="margin: 0; font-size: 17px; color: #4a423b">Add books to your shelf and search in your library</p>
<div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center">
<a href="DeskResults.dc.html" style="height: 52px; padding: 0 24px; border-radius: 12px; background: #2f5340; color: #ffffff; display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.500-3.500"></path></svg>
Search for a book
</a>
<button style="height: 52px; padding: 0 24px; border: 1px solid #2f5340; border-radius: 12px; background: transparent; color: #2f5340; display: flex; align-items: center; gap: 10px; font: inherit; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h3M17 5h3v2M4 17v2h3M17 19h3v-2M8 9v6M10.500 9v6M13.500 9v6M16 9v6"></path></svg>
Scan the barcode on a book
</button>
</div>
</div>

<div aria-hidden="true" style="display: flex; flex-direction: column">
<div style="margin-inline: -40px; padding: 18px 40px 0; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 18px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3">
<div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px; align-items: end; height: 192px">
<div style="display: flex; justify-content: center">
<div style="width: 120px; height: 180px; box-sizing: border-box; border: 1.500px dashed #6b6259; border-radius: 2px; background: rgba(250,247,241,.5)"></div>
</div>
</div>
<div style="height: 12px; margin: -12px -40px 0; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div style="height: 16px; margin-inline: -40px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
<div style="height: 10px; margin-inline: -40px; background: linear-gradient(180deg, rgba(31,26,23,.22), rgba(31,26,23,0))"></div>
<div style="margin-inline: -40px; height: 210px; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 18px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3; display: flex; flex-direction: column; justify-content: flex-end">
<div style="height: 12px; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div style="height: 16px; margin-inline: -40px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
