<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf in use with search motion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5340}a:hover{color:#1f3a2c}
@keyframes mark-pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.shelf-track{transition:none !important}.library-mark{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf7f1; color: #1f1a17; font-family: 'Work Sans', sans-serif; font-size: 16px; line-height: 1.5; padding: 16px; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 2px; height: 44px">
<a href="AccountPanel.dc.html" aria-label="Account and settings" style="width: 44px; height: 44px; margin-left: -10px; color: #4a423b; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.500-4 5-5 8-5s6.500 1 8 5"></path></svg>
</a>
<div style="font-family: Newsreader, serif; font-size: 24px; font-weight: 500; letter-spacing: -0.02em">MyBookshelf</div>
</div>

<div style="margin-top: 12px; height: 52px; display: flex; align-items: center; background: #ffffff; border: 1px solid #cfc6b8; border-radius: 14px; box-sizing: border-box">
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<button onClick="{{openSearch}}" style="flex-grow: 1; height: 50px; border: 0; background: transparent; padding: 0 0 0 14px; display: flex; align-items: center; gap: 10px; font: inherit; color: #6b6259; text-align: left">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.500-3.500"></path></svg>
Title, author or ISBN
</button>
</sc-if>
<sc-if value="{{searching}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; height: 50px; padding-left: 14px; display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5340" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.500-3.500"></path></svg>
<div style="flex-grow: 1">wings of fire</div>
<button aria-label="Clear search and go back to my shelf" onClick="{{closeSearch}}" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; color: #6b6259; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
</sc-if>
<a href="Scan.dc.html" aria-label="Scan a barcode" style="flex-shrink: 0; width: 52px; height: 50px; border-left: 1px solid #e7e0d5; display: flex; align-items: center; justify-content: center; color: #2f5340">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h3M17 5h3v2M4 17v2h3M17 19h3v-2M8 9v6M10.500 9v6M13.500 9v6M16 9v6"></path></svg>
</a>
</div>

<div style="margin-top: 6px; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #4a423b">
<span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 6px; background: #efe9df; border: 1px solid #d6cdbf; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a423b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
Anna Centenary Library
</div>
<div role="group" aria-label="View" style="display: flex; border: 1px solid #d6cdbf; border-radius: 10px; overflow: hidden">
<button aria-label="Shelf view" aria-pressed="true" style="width: 44px; height: 38px; border: 0; padding: 0; background: #e3ecdf; color: #2f5340; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M6 19V7h4v12M10 19V5h3v14M14.500 19l-1-11 3-.500L18 19"></path></svg>
</button>
<button aria-label="List view" aria-pressed="false" style="width: 44px; height: 38px; border: 0; border-left: 1px solid #d6cdbf; padding: 0; background: #ffffff; color: #2f5340; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h12M4 7h.010M4 12h.010M4 17h.010"></path></svg>
</button>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; margin-inline: -16px; overflow: hidden; position: relative">
<div class="shelf-track" style="position: relative; height: 100%; transform: translateY({{offset}}); transition: transform 650ms cubic-bezier(.22,.8,.2,1)">

<div style="position: absolute; left: 0; right: 0; top: -100%; height: 100%; box-sizing: border-box; padding: 0 16px; overflow: hidden">
<div style="height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px">
<sc-if value="{{checking}}" hint-placeholder-val="{{false}}">
<div role="status" style="color: #4a423b">Looking in Anna Centenary Library…</div>
</sc-if>
<sc-if value="{{marked}}" hint-placeholder-val="{{true}}">
<div role="status" style="display: flex; align-items: center; gap: 6px; color: #1f3a2c; font-weight: 600">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #2f5340; color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
In Anna Centenary Library
</div>
</sc-if>
<button onClick="{{closeSearch}}" style="min-height: 32px; border: 0; background: transparent; padding: 0; font: inherit; font-weight: 600; color: #2f5340">Back to my shelf</button>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; margin-bottom: 6px">
<div style="margin-inline: -16px; padding: 12px 16px 0; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 16px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3">
<div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; height: 123px">
<sc-for list="{{row.books}}" as="book" hint-placeholder-count="3">
<div style="display: flex; justify-content: center">
<a href="{{book.href}}" aria-label="{{book.label}}" style="position: relative; display: block; width: 78px; height: 117px; text-decoration: none; filter: drop-shadow(5px 2px 4px rgba(31,26,23,.3))">
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 100%; width: 100%; height: 6px; transform: skewX(-45deg); transform-origin: 0 100%; background: repeating-linear-gradient(0deg, #f6efe0 0 1px, #ddd2bc 1px 2px)"></span>
<span aria-hidden="true" style="position: absolute; left: 100%; top: 0; width: 6px; height: 100%; transform: skewY(-45deg); transform-origin: 0 0; background: repeating-linear-gradient(90deg, #e9dfca 0 1px, #cdbfa5 1px 2px)"></span>
<span style="position: absolute; inset: 0; box-sizing: border-box; padding: 8px 7px 8px 12px; border-radius: 1px 2px 2px 1px; background: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(255,255,255,.16) 3px, rgba(0,0,0,.14) 6px, rgba(0,0,0,0) 11px), linear-gradient(115deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%), {{book.bg}}; color: #fbf3e4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; text-align: center; font-family: Newsreader, serif; font-size: 13px; line-height: 1.2">
<span>{{book.cover}}</span>
<span aria-hidden="true" style="width: 18px; height: 1px; background: rgba(251,243,228,.65)"></span>
<span style="font-family: 'Work Sans', sans-serif; font-size: 11px; line-height: 1.25">{{book.author}}</span>
</span>
<sc-if value="{{book.mine}}" hint-placeholder-val="{{false}}">
<span role="img" aria-label="On my shelf" style="position: absolute; top: -12px; left: -13px; z-index: 2; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: #2f5340; color: #ffffff; border: 2px solid #efe5d3; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>
</span>
</sc-if>
<sc-if value="{{book.showMark}}" hint-placeholder-val="{{false}}">
<span class="library-mark" role="img" aria-label="In Anna Centenary Library" style="position: absolute; top: -12px; right: -13px; z-index: 2; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: #2f5340; color: #ffffff; border: 2px solid #efe5d3; display: flex; align-items: center; justify-content: center; animation: mark-pop 320ms cubic-bezier(.3,1.5,.5,1)">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
</sc-if>
</a>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="height: 12px; margin: -12px -16px 0; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div aria-hidden="true" style="height: 14px; margin-inline: -16px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
<div aria-hidden="true" style="height: 8px; margin-inline: -16px; background: linear-gradient(180deg, rgba(31,26,23,.22), rgba(31,26,23,0))"></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 0; height: 100%; box-sizing: border-box; padding: 0 16px; overflow: hidden">
<div style="height: 40px; display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 500; font-size: 28px; line-height: 40px; letter-spacing: -0.025em">My shelf</h1>
<div style="font-size: 14px; color: #6b6259">6 books</div>
</div>
<sc-for list="{{mine}}" as="row" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; margin-bottom: 6px">
<div style="margin-inline: -16px; padding: 12px 16px 0; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 16px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3">
<div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; height: 132px">
<sc-for list="{{row.books}}" as="book" hint-placeholder-count="3">
<div style="display: flex; justify-content: center">
<a href="BookChecked.dc.html" aria-label="{{book.label}}" style="position: relative; display: block; width: 84px; height: 126px; text-decoration: none; filter: drop-shadow(5px 2px 4px rgba(31,26,23,.3))">
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 100%; width: 100%; height: 6px; transform: skewX(-45deg); transform-origin: 0 100%; background: repeating-linear-gradient(0deg, #f6efe0 0 1px, #ddd2bc 1px 2px)"></span>
<span aria-hidden="true" style="position: absolute; left: 100%; top: 0; width: 6px; height: 100%; transform: skewY(-45deg); transform-origin: 0 0; background: repeating-linear-gradient(90deg, #e9dfca 0 1px, #cdbfa5 1px 2px)"></span>
<span style="position: absolute; inset: 0; box-sizing: border-box; padding: 8px 7px 8px 12px; border-radius: 1px 2px 2px 1px; background: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(255,255,255,.16) 3px, rgba(0,0,0,.14) 6px, rgba(0,0,0,0) 11px), linear-gradient(115deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%), {{book.bg}}; color: #fbf3e4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; text-align: center; font-family: Newsreader, serif; font-size: 13px; line-height: 1.2">
<span>{{book.title}}</span>
<span aria-hidden="true" style="width: 18px; height: 1px; background: rgba(251,243,228,.65)"></span>
<span style="font-family: 'Work Sans', sans-serif; font-size: 11px; line-height: 1.25">{{book.author}}</span>
</span>
<sc-if value="{{book.inLibrary}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="position: absolute; top: -12px; right: -13px; z-index: 2; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: #2f5340; color: #ffffff; border: 2px solid #efe5d3; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
</sc-if>
</a>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="height: 12px; margin: -12px -16px 0; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div aria-hidden="true" style="height: 14px; margin-inline: -16px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
<div aria-hidden="true" style="height: 8px; margin-inline: -16px; background: linear-gradient(180deg, rgba(31,26,23,.22), rgba(31,26,23,0))"></div>
</div>
</sc-for>

<h2 style="margin: 2px 0 6px; font-size: 13px; line-height: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6b6259">Viewed before</h2>
<div style="margin-inline: -16px; padding: 12px 22px 0; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 16px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3">
<div style="position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 3px">
<sc-for list="{{viewed}}" as="book" hint-placeholder-count="6">
<a href="Book.dc.html" aria-label="{{book.label}}" style="flex-shrink: 0; width: {{book.w}}; height: {{book.h}}; box-sizing: border-box; padding: 10px 0; border-radius: 2px 2px 1px 1px; background: linear-gradient(90deg, rgba(0,0,0,.28) 0, rgba(255,255,255,.14) 3px, rgba(0,0,0,0) 8px, rgba(0,0,0,0) 75%, rgba(0,0,0,.22) 100%), {{book.bg}}; color: #fbf3e4; text-decoration: none; writing-mode: vertical-rl; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; filter: drop-shadow(2px 1px 2px rgba(31,26,23,.3))">
<span style="max-height: 100%; font-family: Newsreader, serif; font-size: 13px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{book.title}}</span>
<span style="max-height: 100%; font-family: 'Work Sans', sans-serif; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{book.author}}</span>
</a>
</sc-for>
</div>
<div aria-hidden="true" style="height: 12px; margin: -12px -22px 0; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div aria-hidden="true" style="height: 14px; margin-inline: -16px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { searching: false, marked: false };
}
componentWillUnmount() {
clearTimeout(this.timer);
}
renderVals() {
const searching = this.state.searching;
const marked = this.state.marked;
const r = (cover, title, author, bg, inLibrary, mine, href) => ({ cover, title, bg, href: href || '#', showMark: marked && inLibrary, author, mine, label: title + ' by ' + author + (mine ? ', on my shelf' : '') });
const v = (title, author, bg, w, h) => ({ title, author, bg, w, h, label: title + ' by ' + author });
const m = (title, author, bg, inLibrary) => ({ title, author, bg, inLibrary, label: title + ' by ' + author + (inLibrary ? ', in Anna Centenary Library' : '') });
return {
idle: !searching,
searching,
checking: searching && !marked,
marked: searching && marked,
offset: searching ? '100%' : '0%',
openSearch: () => {
clearTimeout(this.timer);
this.setState({ searching: true, marked: false });
this.timer = setTimeout(() => this.setState({ marked: true }), 1700);
},
closeSearch: () => {
clearTimeout(this.timer);
this.setState({ searching: false, marked: false });
},
rows: [
{ books: [
r('Wings of Fire', 'Wings of Fire: An Autobiography', 'A. P. J. Abdul Kalam', '#7a2e2e', true, true, 'BookChecked.dc.html'),
r('The Dragonet Prophecy', 'The Dragonet Prophecy', 'Tui T. Sutherland', '#274b6d', false, false),
r('Wings of Fire', 'Wings of Fire', 'Dale Brown', '#3b3b3b', true, false)
] },
{ books: [
r('The Lost Heir', 'The Lost Heir', 'Tui T. Sutherland', '#1f5a57', false, false),
r('Wings of Fire', 'Wings of Fire', 'Charles Todd', '#5a4a2a', false, false),
r('Ignited Minds', 'Ignited Minds', 'A. P. J. Abdul Kalam', '#8a4a1f', true, false)
] },
{ books: [
r('The Hidden Kingdom', 'The Hidden Kingdom', 'Tui T. Sutherland', '#3f5a2a', false, false),
r('The Dark Secret', 'The Dark Secret', 'Tui T. Sutherland', '#4a2f5e', false, false),
r('The Brightest Night', 'The Brightest Night', 'Tui T. Sutherland', '#6d2742', false, false)
] }
],
mine: [
{ books: [
m('Wings of Fire', 'A. P. J. Abdul Kalam', '#7a2e2e', true),
m('Ponniyin Selvan', 'Kalki', '#1f5a57', true),
m('Malgudi Days', 'R. K. Narayan', '#8a4a1f', true)
] },
{ books: [
m('The God of Small Things', 'Arundhati Roy', '#3f5a2a', true),
m('The Discovery of India', 'Jawaharlal Nehru', '#274b6d', true),
m('Thirukkural', 'Thiruvalluvar', '#4a2f5e', false)
] }
],
viewed: [
v('Ignited Minds', 'A. P. J. Abdul Kalam', '#8a4a1f', '48px', '128px'),
v('The Guide', 'R. K. Narayan', '#274b6d', '46px', '122px'),
v('Train to Pakistan', 'Khushwant Singh', '#5a4a2a', '52px', '132px'),
v('Gitanjali', 'Rabindranath Tagore', '#6d2742', '44px', '124px'),
v('Godaan', 'Premchand', '#1f5a57', '48px', '120px'),
v('The White Tiger', 'Aravind Adiga', '#7a2e2e', '50px', '130px')
]
};
}
}
</script>
</body>
</html>
