<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find your library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5340}a:hover{color:#1f3a2c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #faf7f1; color: #1f1a17; font-family: 'Work Sans', sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden">

<div aria-hidden="true" style="padding: 60px 16px 0; display: flex; gap: 16px; align-items: flex-end">
<div style="width: 108px; height: 162px; border-radius: 4px; background: #7a2e2e"></div>
<div style="font-family: Newsreader, serif; font-size: 26px; line-height: 1.15; letter-spacing: -0.025em; width: 230px">Wings of Fire: An Autobiography</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31,26,23,.55)"></div>

<div role="dialog" aria-label="Find your library" style="position: absolute; left: 0; right: 0; bottom: 0; background: #faf7f1; border-radius: 22px 22px 0 0; padding: 12px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #d6cdbf; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 500; font-size: 26px; letter-spacing: -0.025em">Find your library</h1>
<a href="Book.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #4a423b">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<button aria-pressed="{{nearPressed}}" onClick="{{showNearby}}" style="height: 52px; border: 1.500px solid #2f5340; border-radius: 12px; background: {{nearBg}}; color: {{nearFg}}; display: flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
Libraries near me
</button>

<div style="display: flex; align-items: center; gap: 12px; color: #6b6259; font-size: 13px">
<div aria-hidden="true" style="flex-grow: 1; height: 1px; background: #e7e0d5"></div>
or
<div aria-hidden="true" style="flex-grow: 1; height: 1px; background: #e7e0d5"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="place" style="font-size: 14px; font-weight: 500; color: #4a423b">City, town or library name</label>
<input id="place" type="search" value="Chennai" onClick="{{showSearch}}" style="height: 52px; box-sizing: border-box; border: 1.500px solid {{inputBorder}}; border-radius: 12px; background: #ffffff; padding: 0 14px; font: inherit; color: #1f1a17">
</div>

<div role="region" aria-live="polite" aria-label="{{listLabel}}" style="display: flex; flex-direction: column">
<div style="font-size: 13px; color: #6b6259; padding-bottom: 4px">{{listLabel}}</div>
<div style="display: flex; flex-direction: column; border-bottom: 1px solid #e7e0d5">
<sc-for list="{{libraries}}" as="lib" hint-placeholder-count="3">
<a href="BookChecked.dc.html" style="min-height: 68px; padding: 10px 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border-top: 1px solid #e7e0d5; text-decoration: none; color: #1f1a17">
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div style="font-weight: 600">{{lib.name}}</div>
<div style="font-size: 14px; color: #6b6259">{{lib.sub}}</div>
</div>
<div style="flex-shrink: 0; font-size: 14px; font-weight: 600; color: #4a423b">{{lib.distance}}</div>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>
</div>

<a href="#" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500">My library isn’t listed</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { nearby: false };
}
renderVals() {
const nearby = this.state.nearby;
const byName = [
{ name: 'Anna Centenary Library', sub: 'Kotturpuram · Public library', distance: '' },
{ name: '[LIBRARY NAME]', sub: '[Area] · University library', distance: '' },
{ name: '[LIBRARY NAME]', sub: '[Area] · College library', distance: '' }
];
const near = [
{ name: 'Anna Centenary Library', sub: 'Kotturpuram · Public library', distance: '2.1 km' },
{ name: '[LIBRARY NAME]', sub: '[Area] · Public library', distance: '3.4 km' },
{ name: '[LIBRARY NAME]', sub: '[Area] · College library', distance: '5.8 km' }
];
return {
libraries: nearby ? near : byName,
listLabel: nearby ? 'Nearest first' : 'Libraries in Chennai',
nearPressed: nearby ? 'true' : 'false',
nearBg: nearby ? '#e3ecdf' : '#2f5340',
nearFg: nearby ? '#1f3a2c' : '#ffffff',
inputBorder: nearby ? '#cfc6b8' : '#2f5340',
showNearby: () => this.setState({ nearby: true }),
showSearch: () => this.setState({ nearby: false })
};
}
}
</script>
</body>
</html>
