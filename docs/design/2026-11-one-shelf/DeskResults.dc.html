<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5340}a:hover{color:#1f3a2c}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; background: #faf7f1; color: #1f1a17; font-family: 'Work Sans', sans-serif; font-size: 15px; line-height: 1.5; overflow: hidden">

<aside aria-label="Library and account" style="flex: 0 0 300px; width: 300px; box-sizing: border-box; height: 900px; background: #f3ede2; border-right: 1px solid #e2d9ca; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 30px">
<div style="font-family: Newsreader, serif; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1">MyBookshelf</div>
<section aria-labelledby="lib-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="lib-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">My library</h2>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; background: #faf7f1; border: 1px solid #d6cdbf; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a423b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; min-width: 0">
<div style="font-weight: 600; line-height: 1.3">Anna Centenary Library</div>
<div style="font-size: 14px; color: #6b6259">Kotturpuram, Chennai</div>
</div>
</div>
<a href="DeskLibrary.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font-weight: 600; text-decoration: none">Change</a>
</section>
<section aria-labelledby="acct-h" style="display: flex; flex-direction: column; gap: 6px">
<h2 id="acct-h" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">Account</h2>
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<span aria-hidden="true" style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 17px; background: #2f5340; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600">D</span>
<div style="font-size: 14px; color: #4a423b; overflow-wrap: anywhere">[EMAIL]</div>
</div>
<a href="#" style="min-height: 40px; display: flex; align-items: center; font-weight: 500; text-decoration: none">Account settings</a>
<a href="#" style="min-height: 40px; display: flex; align-items: center; font-weight: 500; text-decoration: none">Log out</a>
</section>
<section aria-labelledby="light-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="light-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6259">Reading light</h2>
<div role="group" aria-labelledby="light-h" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #d6cdbf; border-radius: 10px; overflow: hidden; background: #ffffff">
<button aria-pressed="true" style="height: 44px; border: 0; background: #e3ecdf; color: #1f3a2c; font: inherit; font-size: 13px; font-weight: 600">Daylight</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-left: 1px solid #d6cdbf; background: #ffffff; color: #4a423b; font: inherit; font-size: 13px">Lamplight</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-left: 1px solid #d6cdbf; background: #ffffff; color: #4a423b; font: inherit; font-size: 13px">Ink</button>
</div>
</section>
<nav aria-label="Help" style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px">
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">Report a problem</a>
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">Privacy</a>
<a href="#" style="min-height: 36px; display: flex; align-items: center; text-decoration: none; color: #4a423b">About</a>
</nav>
</aside>

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 900px; padding: 24px 40px 0; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px">
<div style="flex: 1 1 auto; max-width: 680px; height: 52px; display: flex; align-items: center; background: #ffffff; border: 1.500px solid #2f5340; border-radius: 14px; padding-left: 16px; gap: 10px; box-sizing: border-box">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5340" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.500-3.500"></path></svg>
<input aria-label="Search for a book" type="search" value="wings of fire" style="flex-grow: 1; min-width: 0; height: 46px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #1f1a17; outline: none">
<a href="DeskShelf.dc.html" aria-label="Clear search and go back to my shelf" style="width: 44px; height: 44px; color: #6b6259; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<button aria-label="Scan a barcode" style="flex-shrink: 0; width: 56px; height: 48px; border: 0; border-left: 1px solid #e7e0d5; background: transparent; color: #2f5340; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h3M17 5h3v2M4 17v2h3M17 19h3v-2M8 9v6M10.500 9v6M13.500 9v6M16 9v6"></path></svg>
</button>
</div>
<div role="group" aria-label="View" style="margin-left: auto; display: flex; border: 1px solid #d6cdbf; border-radius: 10px; overflow: hidden">
<button aria-label="Shelf view" aria-pressed="true" style="width: 46px; height: 44px; border: 0; padding: 0; background: #e3ecdf; color: #2f5340; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M6 19V7h4v12M10 19V5h3v14M14.500 19l-1-11 3-.500L18 19"></path></svg>
</button>
<button aria-label="List view" aria-pressed="false" style="width: 46px; height: 44px; border: 0; border-left: 1px solid #d6cdbf; padding: 0; background: #ffffff; color: #2f5340; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h12M4 7h.010M4 12h.010M4 17h.010"></path></svg>
</button>
</div>
</div>

<div style="margin: 14px 0 18px; min-height: 44px; display: flex; align-items: center; gap: 24px">
<a href="DeskShelf.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Back to my shelf
</a>
<div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1f3a2c">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; background: #2f5340; color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
In Anna Centenary Library
</div>
</div>

<sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; margin-bottom: 8px">
<div style="margin-inline: -40px; padding: 18px 40px 0; background: linear-gradient(180deg, rgba(31,26,23,.13), rgba(31,26,23,0) 18px), repeating-linear-gradient(90deg, rgba(120,84,48,.04) 0 2px, rgba(120,84,48,0) 2px 9px), #efe5d3">
<div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px; align-items: end; height: 192px">
<sc-for list="{{row.books}}" as="book" hint-placeholder-count="6">
<div style="display: flex; justify-content: center">
<a href="DeskBook.dc.html" aria-label="{{book.label}}" style="position: relative; display: block; width: 120px; height: 180px; text-decoration: none; box-shadow: 7px 5px 12px -5px rgba(31,26,23,.4)">
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 100%; width: 100%; height: 8px; transform: skewX(-45deg); transform-origin: 0 100%; background: repeating-linear-gradient(0deg, #f6efe0 0 1px, #ddd2bc 1px 2px)"></span>
<span aria-hidden="true" style="position: absolute; left: 100%; top: 0; width: 8px; height: 100%; transform: skewY(-45deg); transform-origin: 0 0; background: repeating-linear-gradient(90deg, #e9dfca 0 1px, #cdbfa5 1px 2px)"></span>
<span style="position: absolute; inset: 0; box-sizing: border-box; padding: 12px 10px 12px 16px; border-radius: 1px 2px 2px 1px; background: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(255,255,255,.16) 3px, rgba(0,0,0,.14) 7px, rgba(0,0,0,0) 13px), linear-gradient(115deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%), {{book.bg}}; color: #fbf3e4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; text-align: center; font-family: Newsreader, serif; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere">
<span>{{book.title}}</span>
<span aria-hidden="true" style="width: 22px; height: 1px; background: rgba(251,243,228,.65)"></span>
<span style="font-family: 'Work Sans', sans-serif; font-size: 12px; line-height: 1.25">{{book.author}}</span>
</span>
<sc-if value="{{book.mine}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; top: -13px; left: -13px; z-index: 2; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; background: #2f5340; color: #ffffff; border: 2px solid #efe5d3; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>
</span>
</sc-if>
<sc-if value="{{book.inLibrary}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="position: absolute; top: -13px; right: -14px; z-index: 2; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; background: #2f5340; color: #ffffff; border: 2px solid #efe5d3; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
</span>
</sc-if>
</a>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="height: 12px; margin: -12px -40px 0; background: linear-gradient(180deg, #b88959, #d6ab7c)"></div>
</div>
<div aria-hidden="true" style="height: 16px; margin-inline: -40px; box-sizing: border-box; border-top: 1px solid #e9c59b; background: linear-gradient(180deg, #cb9a66 0, #b9854f 55%, #a47340 100%)"></div>
<div aria-hidden="true" style="height: 10px; margin-inline: -40px; background: linear-gradient(180deg, rgba(31,26,23,.22), rgba(31,26,23,0))"></div>
</div>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const b = (title, author, bg, inLibrary, mine) => ({ title, author, bg, inLibrary, mine: Boolean(mine), label: title + ' by ' + author + (mine ? ', on my shelf' : '') + (inLibrary ? ', in your library' : '') });
return {
rows: [
{ books: [
b('Wings of Fire', 'A. P. J. Abdul Kalam', '#7a2e2e', true, true),
b('The Dragonet Prophecy', 'Tui T. Sutherland', '#274b6d', false),
b('Wings of Fire', 'Dale Brown', '#3b3b3b', true),
b('The Lost Heir', 'Tui T. Sutherland', '#1f5a57', false),
b('Wings of Fire', 'Charles Todd', '#5a4a2a', false),
b('Ignited Minds', 'A. P. J. Abdul Kalam', '#8a4a1f', true)
] },
{ books: [
b('The Hidden Kingdom', 'Tui T. Sutherland', '#3f5a2a', false),
b('The Dark Secret', 'Tui T. Sutherland', '#4a2f5e', false),
b('The Brightest Night', 'Tui T. Sutherland', '#6d2742', false)
] }
]
};
}
}
</script>
</body>
</html>
