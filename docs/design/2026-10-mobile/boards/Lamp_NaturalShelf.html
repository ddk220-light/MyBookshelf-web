<style>
body{margin:0}

</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

      <button type="button" aria-label="Show as list" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--fill); color: var(--ink)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 4.5h9M6 9h9M6 13.5h9M2.5 4.5h.01M2.5 9h.01M2.5 13.5h.01"></path></svg></button>
    </div>
  </header>
  <p style="margin: 0; padding: 0 16px 14px; font-size: 14px; color: var(--ink3)">7 books · recently added first</p>

  <section aria-label="Saved books" style="display: flex; flex-direction: column; gap: 20px">

        <li><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 148px; box-sizing: border-box; border: 1.5px dashed var(--dash); border-radius: 4px; color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3v12M3 9h12"></path></svg>Add a book</a></li>

  <section aria-labelledby="rv" style="display: flex; flex-direction: column; gap: 12px; padding: 30px 0 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px">
      <h2 id="rv" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px">Recently viewed</h2>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: var(--accent); text-decoration: none">Edit</a>
    </div>
    <ul style="margin: 0; padding: 0 16px; list-style: none; display: flex; gap: 14px; overflow: hidden">
      <li style="flex: 0 0 72px"><a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit"><img src="../assets/reference-cover.svg" alt="" style="width: 72px; height: 108px; object-fit: cover; border-radius: 2px 3px 3px 2px; box-shadow: 0 0 0 1px var(--coveredge), 1px 2px 5px var(--covershadow)"><span style="font-size: 12px; line-height: 15px">The Hobbit</span></a></li>

      <li style="flex: 0 0 72px"><a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit"><img src="../assets/reference-cover.svg" alt="" style="width: 72px; height: 108px; object-fit: cover; border-radius: 2px 3px 3px 2px; box-shadow: 0 0 0 1px var(--coveredge), 1px 2px 5px var(--covershadow)"><span style="font-size: 12px; line-height: 15px">Fantastic Mr Fox</span></a></li>
      <li style="flex: 0 0 72px"><a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit"><img src="../assets/reference-cover.svg" alt="" style="width: 72px; height: 108px; object-fit: cover; border-radius: 2px 3px 3px 2px; box-shadow: 0 0 0 1px var(--coveredge), 1px 2px 5px var(--covershadow)"><span style="font-size: 12px; line-height: 15px">A Court of Mist and Fury</span></a></li>
    </ul>
  </section>

  <span style="flex: 1"></span>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: var(--bar); border-top: 1px solid var(--line)">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none"><svg width="24" height="24" viewBox="0 0 22 22" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5h3v15h-3zM7.5 3.5h3v15h-3zM12 4.6l2.9-.8 3.9 14.5-2.9.8z"></path></svg>Shelf</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--ink3); font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>Search</a>

    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; color: var(--ink3); font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="3"></circle><path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2M5 5l1.6 1.6M15.4 15.4L17 17M5 17l1.6-1.6M15.4 6.6L17 5"></path></svg>Settings</a>
  </nav>
</div>
