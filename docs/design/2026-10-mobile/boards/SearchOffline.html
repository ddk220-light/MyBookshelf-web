<!doctype html>
<html lang="en">
<head>
<style>@font-face{font-family:Newsreader;src:url("../../../../client/public-app/fonts/Newsreader.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}</style>
<meta charset="utf-8">
<title>Search offline</title>

</head>
<body>
<x-dc>
<helmet>


<style>
body{margin:0}
:root{--bg:#faf7f1;--surface:#fff;--fill:#efe9df;--ink:#1f1a17;--ink2:#4a423b;--ink3:#6b6259;--ink4:#8a8178;--line:#e7e0d5;--line2:#efe9df;--accent:#2f5340;--on:#fff;--bar:rgba(250,247,241,.96);--ok:#2f7a4b;--out:#b4532a;--chk:#9a6200;--ref:#6b4fa0;--none:#6b6259;--err:#b42318;--onstatus:#fff;--wood:#c19062;--woodhi:#d9a978;--woodlo:#9b6b40;--woodshadow:rgba(80,50,25,.25);--hero:#ece3d3;--page1:#f6f0e2;--page2:#ddd2bd;--coveredge:rgba(31,26,23,0);--covershadow:rgba(31,26,23,.28);--placeholder:#e9e1d3;--dash:#c9bda9;--toastbg:#2b2420;--toastink:#fbf8f1;--toastacc:#e9c58a;--dangerbg:#b42318;--dangerink:#fff;--prose:#2b2420;--mark:#f3e3b5}

.ph{box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.lt{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;line-height:40px}
.fld{position:relative;display:flex;align-items:center}
.fld input{box-sizing:border-box;width:100%;height:44px;padding:0 48px 0 38px;border:0;border-radius:12px;background:var(--fill);font:17px system-ui,-apple-system,sans-serif;color:var(--ink)}
.tb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px 22px;background:var(--bar);border-top:1px solid var(--line)}
.tb a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;padding-top:4px;color:var(--ink3);font-size:12px;text-decoration:none}
.tb a[aria-current]{color:var(--accent);font-weight:600}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 900px">
  <div role="status" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 46px 16px 10px; background: var(--toastbg); color: var(--toastink); font-size: 14px"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 7.5a12 12 0 0 1 16 0M5 10.8a7.5 7.5 0 0 1 10 0M8 14a3 3 0 0 1 4 0M3 3l14 14"></path></svg>You're offline</div>
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 10px">
    <h1 class="lt">Search</h1>
    <label class="fld">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Title, author or ISBN</span>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; color: var(--ink3)"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>
      <input type="search" value="dune">
    </label>
  </header>

  <section aria-labelledby="off" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 32px 0; text-align: center">
    <h2 id="off" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 26px; line-height: 32px">Search needs a connection</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink2)">We'll run “dune” as soon as you're back online. Your shelf is saved on this device, so it still works.</p>
    <a href="#" style="display: inline-grid; place-items: center; height: 48px; margin-top: 10px; padding: 0 22px; border-radius: 12px; background: var(--accent); color: var(--on); font-weight: 600; font-size: 16px; text-decoration: none">Go to your shelf</a>
  </section>

  <span style="flex: 1"></span>
  <nav class="tb" aria-label="Main">
    <a href="#"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5h3v15h-3zM7.5 3.5h3v15h-3zM12 4.6l2.9-.8 3.9 14.5-2.9.8z"></path></svg>Shelf</a>
    <a href="#" aria-current="page"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>Search</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l8-4.5L19 8M4.5 8v8.5M8.5 8v8.5M13.5 8v8.5M17.5 8v8.5M3 18.5h16"></path></svg>Libraries</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="3"></circle><path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2M5 5l1.6 1.6M15.4 15.4L17 17M5 17l1.6-1.6M15.4 6.6L17 5"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
