<!doctype html>
<html lang="en">
<head>
<style>@font-face{font-family:Newsreader;src:url("../../../../client/public-app/fonts/Newsreader.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}</style>
<meta charset="utf-8">
<title>Shelf storage blocked</title>

</head>
<body>
<x-dc>
<helmet>


<style>
body{margin:0}
:root{--bg:#15120f;--surface:#1f1b17;--fill:#2b2621;--ink:#f1e9dc;--ink2:#d3c8b8;--ink3:#a89d8c;--ink4:#8f8474;--line:#463d33;--line2:#2f2923;--accent:#9fd0ae;--on:#10261a;--bar:rgba(21,18,15,.96);--ok:#7fcf98;--out:#f0956b;--chk:#e8b45a;--ref:#c2aef0;--none:#a89d8c;--err:#f28b82;--onstatus:#15120f;--wood:#6e4a30;--woodhi:#8a5f3e;--woodlo:#4a301d;--woodshadow:rgba(0,0,0,.5);--hero:#231e19;--page1:#cbbfa9;--page2:#9e927d;--coveredge:rgba(255,255,255,.14);--covershadow:rgba(0,0,0,.6);--placeholder:#2b2621;--dash:#5c5145;--toastbg:#f1e9dc;--toastink:#1f1a17;--toastacc:#2f5340;--dangerbg:#f28b82;--dangerink:#2a0e0b;--prose:#e8dfd0;--mark:#5a4520}

.ph{box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.lt{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;line-height:40px}
.fld{position:relative;display:flex;align-items:center}
.fld input{box-sizing:border-box;width:100%;height:44px;padding:0 44px 0 38px;border:0;border-radius:12px;background:var(--fill);font:17px system-ui,-apple-system,sans-serif;color:var(--ink)}
.fld input::placeholder{color:var(--ink3)}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--fill);color:var(--ink);font:500 14px system-ui,-apple-system,sans-serif}
.chip.on{background:var(--accent);color:var(--on);font-weight:600}
.cap{margin:0 8px 6px;font-size:13px;font-weight:500;color:var(--ink3)}
.grp{margin:0;padding:0 16px;list-style:none;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:66px;border-bottom:1px solid var(--line2);color:inherit;text-decoration:none}
.grp li:last-child .row{border-bottom:0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid var(--line2);font-size:15px;color:var(--ink);text-decoration:none}
.grp > :last-child.rl,.grp li:last-child .rl{border-bottom:0}
.t1{font-size:16px;font-weight:600}
.t2{font-size:14px;color:var(--ink3)}
.km{flex:0 0 auto;font-size:14px;color:var(--ink3);font-variant-numeric:tabular-nums}
.note{margin:10px 8px 0;font-size:13px;line-height:1.45;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--on);font:600 16px system-ui,-apple-system,sans-serif}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:500 15px system-ui,-apple-system,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px 22px;background:var(--bar);border-top:1px solid var(--line)}
.tb a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;padding-top:4px;color:var(--ink3);font-size:12px;text-decoration:none}
.tb a[aria-current]{color:var(--accent);font-weight:600}
.board{height:12px;background:var(--wood);box-shadow:inset 0 2px 0 var(--woodhi),inset 0 -3px 0 var(--woodlo),0 6px 10px var(--woodshadow)}
.bk{display:block;box-shadow:0 0 0 1px var(--coveredge), 2px 4px 8px var(--covershadow);border-radius:2px 4px 4px 2px}
.bk img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px 4px 4px 2px}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-radius:22px;background:var(--fill);color:var(--ink);font:500 14px system-ui,-apple-system,sans-serif}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:22px;background:var(--fill);color:var(--ink)}
.ibtn.on{background:var(--accent);color:var(--on)}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 1000px">
  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 44px 16px 8px">
    <h1 class="lt">Shelf</h1>
    <div style="display: flex; align-items: center; gap: 8px; padding-bottom: 2px"><button type="button" class="hbtn" aria-label="Your library: Anna Centenary Library. Change"><svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--accent)"><path d="M3 8l8-4.5L19 8M4.5 8v8.5M8.5 8v8.5M13.5 8v8.5M17.5 8v8.5M3 18.5h16"></path></svg>Anna Centenary<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ink3)"><path d="M4 6l4 4 4-4"></path></svg></button><button type="button" class="ibtn" aria-label="Show as list"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 4.5h9M6 9h9M6 13.5h9M2.5 4.5h.01M2.5 9h.01M2.5 13.5h.01"></path></svg></button></div>
  </header>

  <section role="alert" style="display: flex; gap: 12px; margin: 6px 16px 22px; padding: 16px; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), inset 4px 0 0 var(--chk)">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 22px; color: var(--chk); margin-top: 1px"><path d="M11 3l9 16H2z"></path><path d="M11 9v4.5M11 16.2h.01"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600">This browser isn't saving your shelf</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink2)">It may be in private mode, or site data is blocked. You can keep browsing, but these books will be gone when you close the tab.</p>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-size: 15px; font-weight: 500; text-decoration: none">How to keep your shelf</a>
    </div>
  </section>
  <p style="margin: 0; padding: 0 16px 14px; font-size: 14px; color: var(--ink3)">2 books · this visit only</p>
  <section aria-label="Saved books">
    <div>
      <ul style="margin: 0; padding: 0 24px; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: end">
        <li><a href="#" class="bk" aria-label="The Hobbit by J.R.R. Tolkien" style="height: 160px"><img src="../assets/reference-cover.svg" alt=""></a></li><li><a href="#" class="bk" aria-label="The Pillars of the Earth by Ken Follett" style="height: 160px"><img src="../assets/reference-cover.svg" alt=""></a></li><li aria-hidden="true"></li>
      </ul>
      <div class="board" aria-hidden="true"></div>
    </div>
  </section>
  <span style="flex: 1"></span>
  <nav class="tb" aria-label="Main">
    <a href="#" aria-current="page"><svg width="24" height="24" viewBox="0 0 22 22" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5h3v15h-3zM7.5 3.5h3v15h-3zM12 4.6l2.9-.8 3.9 14.5-2.9.8z"></path></svg>Shelf</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>Search</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l8-4.5L19 8M4.5 8v8.5M8.5 8v8.5M13.5 8v8.5M17.5 8v8.5M3 18.5h16"></path></svg>Libraries</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="3"></circle><path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2M5 5l1.6 1.6M15.4 15.4L17 17M5 17l1.6-1.6M15.4 6.6L17 5"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
