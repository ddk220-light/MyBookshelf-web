<!doctype html>
<html lang="en">
<head>
<style>@font-face{font-family:Newsreader;src:url("../../../../client/public-app/fonts/Newsreader.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}</style>
<meta charset="utf-8">
<title>Barcode scanner</title>

</head>
<body>
<x-dc>
<helmet>


<style>
body{margin:0}
.br{position:absolute;width:30px;height:30px;border-color:#fff;border-style:solid;border-width:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #12100e; color: #f4efe6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 40px 8px 0">
    <button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #f4efe6; font: 500 17px system-ui, -apple-system, sans-serif">Close</button>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Scan a barcode</h1>
    <button type="button" aria-label="Turn on light" aria-pressed="false" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,.12); color: #f4efe6; margin-right: 6px"><svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h10l-2 5H6zM6 7h6v11H6zM9 11v3"></path></svg></button>
  </div>

  <div aria-label="Camera preview" role="img" style="position: relative; flex: 0 0 470px; margin: 18px 0 0; background: radial-gradient(120% 80% at 50% 45%, #3a332c 0%, #1e1a16 70%); overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 92px; top: 150px; width: 206px; height: 120px; background: #f2ede3; border-radius: 3px; transform: rotate(-4deg); box-shadow: 0 6px 20px rgba(0,0,0,.4); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px">
      <span style="width: 150px; height: 58px; background: repeating-linear-gradient(90deg, #1f1a17 0 2px, transparent 2px 4px, #1f1a17 4px 5px, transparent 5px 8px, #1f1a17 8px 11px, transparent 11px 12px)"></span>
      <span style="font: 600 11px ui-monospace, monospace; color: #1f1a17; letter-spacing: .12em">5 012345 678900</span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 50px; top: 120px; width: 290px; height: 180px">
      <span class="br" style="left: 0; top: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 14px"></span>
      <span class="br" style="right: 0; top: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 14px"></span>
      <span class="br" style="left: 0; bottom: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 14px"></span>
      <span class="br" style="right: 0; bottom: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 14px"></span>
    </div>
    <p role="status" style="position: absolute; left: 24px; right: 24px; bottom: 28px; margin: 0; padding: 12px 16px; border-radius: 12px; background: rgba(18,16,14,.82); font-size: 15px; line-height: 1.45; text-align: center">That barcode isn't a book's ISBN. Look for the one that starts with <b>978</b> or <b>979</b>, usually on the back cover.</p>
  </div>

  <section aria-labelledby="type" style="display: flex; flex-direction: column; gap: 12px; padding: 22px 16px 0">
    <h2 id="type" style="margin: 0; font-size: 15px; font-weight: 500; color: #cfc6b8">Or type the ISBN</h2>
    <div style="display: flex; gap: 10px">
      <label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ISBN</span><input inputmode="numeric" placeholder="978…" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: #2b2621; color: #f4efe6; font: 17px ui-monospace, monospace; letter-spacing: .04em"></label>
      <button type="button" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #9fd0ae; color: #10261a; font: 600 16px system-ui, -apple-system, sans-serif">Find</button>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #a89d8c">The camera stays on this device. Nothing is recorded or uploaded.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
