name: Web application
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      accounts-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-account-tests
          POSTGRES_DB: accounts_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounts_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      ACCOUNT_TEST_DATABASE_URL: postgres://postgres:local-account-tests@127.0.0.1:55432/accounts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/deployment/check-client-service-build.mjs
      - run: python -m unittest discover -s tools/content -v
      - run: node --test tools/content/*.test.mjs
      - run: npm run typecheck:client
      - run: npm run test:client
      - run: npm test --workspace=server
      - run: npm run test:library-connectors
      - run: npm run build
      - run: npm run test:seo
      - run: node --test tools/deployment/*.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e --workspace=client -- --project=chromium --project=mobile-chromium --project=webkit --workers=2
      - run: npm run test:e2e --workspace=client -- --project=chromium --project=mobile-chromium --project=webkit --workers=2
        env:
          VITE_CONTENT_DISCOVERY_ENABLED: 'true'
          VITE_CHILDREN_PILOT_ENABLED: 'true'
          FREE_CONTENT_E2E: 'true'
      - name: Verify real account browser journeys against disposable Postgres
        env:
          ACCOUNT_E2E: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4300
        run: |
          # Each profile gets fresh limiter secrets; exercise real production
          # limits without exhausting one synthetic loopback IP across profiles.
          for account_browser in chromium mobile-chromium webkit; do
            node tools/accounts/e2e-server.mjs > "/tmp/accounts-e2e-$account_browser.log" 2>&1 &
            account_harness_pid=$!
            trap 'kill "$account_harness_pid" 2>/dev/null || true' EXIT
            curl --fail --silent --output /dev/null --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4300/api/health
            npm run test:e2e --workspace=client -- accounts-real.spec.js accounts-visual.spec.js --project="$account_browser" --workers=2
            kill "$account_harness_pid"
            wait "$account_harness_pid" || true
          done
