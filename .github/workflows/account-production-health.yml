name: Production account health
on:
  workflow_dispatch:
  schedule:
    # Every six hours, three minutes after the hourly account job (vercel.json,
    # minute 43), so the check usually finds the database still awake from it.
    # Readiness requires a successful job run within the last three hours.
    - cron: '46 */6 * * *'
permissions: {}
concurrency:
  group: account-production-health
  cancel-in-progress: false
jobs:
  account-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production worker freshness and configured services
        run: |
          # Readiness is aggregate only. No database, session or cron credential
          # enters Actions. A failed/stale worker fails this independent job.
          curl --fail --silent --show-error --max-time 25 \
            --output /tmp/account-health.json \
            https://mybookshelf.cloud/api/account/health
          node -e 'const fs = require("node:fs"); if (JSON.parse(fs.readFileSync("/tmp/account-health.json", "utf8")).status !== "ready") process.exit(1); console.log("Production account worker and prerequisites are ready.");'
      - name: Check the catalog store answers
        # Checked even when the account step failed, so both are reported.
        if: ${{ !cancelled() }}
        run: |
          # /api/health reports the catalog store as one word: ok, failed or
          # off (no database configured). The store fails open for readers,
          # so a broken connection is otherwise silent. "failed" fails this
          # job; "off" does not. One retry after a pause covers a database
          # that was waking up.
          for attempt in 1 2; do
            curl --fail --silent --show-error --max-time 25 \
              --output /tmp/health.json \
              https://mybookshelf.cloud/api/health
            word=$(node -e 'const fs = require("node:fs"); process.stdout.write(String(JSON.parse(fs.readFileSync("/tmp/health.json", "utf8")).catalogStore ?? "missing"));')
            if [ "$word" != "failed" ]; then
              echo "Catalog store: $word"
              exit 0
            fi
            [ "$attempt" = 1 ] && sleep 20
          done
          echo "Catalog store: failed"
          exit 1
