name: Bug report
description: Report a problem using the web application.
body:
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and browser/device
      description: Exclude credentials and private library information.
    validations:
      required: true
