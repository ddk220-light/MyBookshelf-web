name: Correct a library’s details
description: Correct published facts with an official source.
body:
  - type: input
    id: library
    attributes:
      label: Library name or MyBookshelf URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Field and correction
      description: Do not include card numbers, PINs or private information.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
    validations:
      required: true
