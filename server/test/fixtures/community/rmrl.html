<script>self.__next_f.push([1,"The performances were shot and recorded on Video 8 tapes by Susan Seizer, the ethnographer, during her dissertation fieldwork from 9/1991-7/1993. The original collection of Video 8 tapes remains with the ethnographer. A total of 31 videos, including 28 performances of Special Drama (aka Iyal Isai Nadakam) + 3 videos of documentary footage from the villages of Valaiyangulam, Madurai, and Kothamangam, Chettinadu. The dramas are primarily mythological plays written by Sankaradas Swamigal (1867-1922). Performances are known as Special Drama (Special Nadakam) because each individual artiste is hired specially for every performance; there are no troupes, directors, or rehearsals. Each performance is unique. Musical accompaniment, instrumental and vocal, is a key part of every performance. Songs written by Sankaradas Swamigal are frequently supplemented by the artists with tunes from cinema and folk songs. This collection is owned by Susan Seizer, Professor Emeritus, Department of Anthropology, Indiana University, Bloomington IN, USA, and archived in Roja Muthiah Research Library, Chennai."])</script>
<script>self.__next_f.push([1,"11:[\"$\",\"$L12\",null,{\"locale\":\"en\",\"now\":\"$D2026-10-22T16:33:07.806Z\",\"timeZone\":\"UTC\",\"messages\":{\"rm\":\"Roja Muthiah\",\"rl\":\"Research Library\",\"cat\":\"Catalogue\",\"dl\":\"Digital Library\",\"rmrl\":\"Roja Muthiah Research Library\",\"welcome\":\"Treasure trove of Tamil Culture\",\"about\":\"The Roja Muthiah Research Library (RMRL) encompasses a library, an archive, a museum, and research centres. Established in 1994, it houses an impressive collection of 500,000 items and represents major aspects of Tamil civilisation. It has digitally preserved over 3 million page images, runs a digital library and engages in international collaborations.\",\"i1\":\"About RMRL\",\"i2\":\"Search Catalogue\",\"i3\":\"Browse Digital Library\",\"i4\":\"Visit RMRL\",\"i5\":\"Cataloguing \u0026 Preservation\",\"i6\":\"Indus Research Centre\",\"i7\":\"Centre for Study in Public Sphere\",\"i8\":\"Publications\",\"i9\":\"RMRL Collection\",\"i10\":\"Events\",\"i11\":\"Newsletter\",\"i12\":\"Volunteering for RMRL\",\"i13\":\"FootPrints of History\",\"i14\":\"Newsletter\",\"i15\":\"E-Journal\",\"i16\":\"Bulletin\",\"support\":\"Tamil Knowledge Campus\",\"support_content\":\"The RMRL has embarked on a major journey to build the Tamil Knowledge Campus. The TKC will encompass the RMRL, the Indus Research Centre, Centre for Study in Public Sphere, Museum of Print Culture, the Indus Interpretation Centre, an auditorium and gallery.\",\"support_content2\":\"Support this cause by donating towards the construction of the Tamil Knowledge Campus.\",\"support_button\":\"Donate \",\"support_button2\":\"Learn more about TKC\",\"about_heading\":\"About RMRL\",\"about_p1\":\"The library is named after the late Roja Muthiah who had originally collected about 50,000 books and 50,000 other items like periodicals, ephemera, wedding invitations, pamphlets and clippings. Roja Muthiah of Kottaiyur in Tamil Nadu’s Sivagangai district was a sign-board artist. Immediately after his premature death in 1992, the University of Chicago (UoC) launched a global effort to save the collection. It was moved to Chennai and institutionalised in 1994. Subsequently, in 2004, the RMRL Trust was formed and an MoU was signed with the UoC for the maintenance of the collection. After the objectives of the MoU were met, the entire collection was transferred to the RMRL Trust to expand, maintain, and carry out its objectives.\",\"about_p2\":\"RMRL, which has taken up several preservation projects, was initially funded by the National Endowment for the Humanities, the Ford Foundation, the Welcome Trust for the History of Understanding Medicine, the Endangered Archives Project, the TATA Trusts, the India Foundation for the Arts, the National Archives of India, the Tamil Nadu Government and several individuals and CSR initiatives.\",\"about_p3\":\"RMRL expanded its activities from collection, development, cataloguing and preservation of books to conserving books and conducting public lectures, seminars, exhibitions and research activities. RMRL started the Indus Research Centre (in 2007) and the Centre for Study in Public Sphere (in 2021).\",\"about_p4\":\"Now the library functions on the premises that have been leased to it by the Government of Tamil Nadu. The State government supports the library with recurring grants since 2023 to sustain some of its major library activities.\",\"about_p5\":\"RMRL is considered to be a culturally significant institution that showcases the civilisational heritage of Tamil and brings people together on a common platform for intellectual deliberation. The organisation collaborates with world-renowned institutions and is in line with best practices of activities relating to libraries, archives and museum\",\"about_h2\":\"Tamil Knowledge Campus - An initiative of RMRL\",\"about_p6\":\"The Tamil Knowledge Campus (TKC) is an initiative of the Roja Muthiah Research Library (RMRL) to establish a world-class integrated campus for the preservation, research, and dissemination of Tamil knowledge and culture. The campus will integrate the library, archive, museum, conservation \u0026 digitization facilities, research centres and public spaces such as exhibition halls, auditorium, amphitheatre to provide an immersive learning and research environment for scholars, students, and the public. The construction activities for the Tamil Knowledge Campus commenced in July 2025 and are currently progressing. The total estimated budget for the project is INR 40 crores.\",\"about_h3\":\" To become a member of TKC Development Federation \",\"annual_report\":\"Annual Reports\",\"tkc_link\":\"Click here \",\"tkc\":\"Proposed TKC building\",\"history\":\"History\",\"h1\":\"The university of chicago (UOC) launches a global initiative to save the private collection of the late Roja Muthaiah of Kottaiyur by purchasing it.\",\"h2\":\"UoC gifts the collection to the Roja Muthiah Research Library trust.\",\"h3\":\"Iravatham Mahadevan advises RMRl to set up the Indus Research Centre.\",\"h4\":\"The Government of Tamil Nadu leases out the current premises as a permanent home to expand the collection. The notable collections include those of Mu.Arunachalam, Thanjai Prakash, Te.po. Meenakshi Sundaram, Susan and Lloyd Rudolph and the UoC.\",\"h5\":\"The Navajbai Ratan Tata Trust provides a major grant to set up a full-fledged studio for conservation of Library material.\",\"h6\":\"RMRL publishes its first book ‘Journey of a  Civilization:Indus to Vaigai’ authored by R.Balakrishnan.\",\"h7\":\"RMRL opens a new research facility called the Centre for Study in Public Sphere to map the journey of modern Tamil Nadu and its social transformation.\",\"h8\":\"RMRL publishes its publication, ஒரு பண்பாட்டின் பயணம், authored by R. Balakrishanan. The Chief Ministers of Tamil Nadu launches the  book.\",\"team\":\"Team\",\"trustees\":\"Board of Trustees\",\"t2\":\"M. Arumugam\",\"td2\":\"Entrepreneur\",\"t3\":\"R. Balakrishnan\",\"td3\":\"Civil Services (Retd.)\",\"t5\":\"Manuraj Shunmugasundaram\",\"td5\":\"Lawyer\",\"t6\":\"Mariam Ram\",\"td6\":\"Publishing\",\"t7\":\"B. G. Rajendran (Indran)\",\"td7\":\"Writer, Art Critic\",\"t8\":\"R. Ramachandran\",\"td8\":\"Auditor\",\"t9\":\"Ramani Natarajan\",\"td9\":\"Constitutional Lawyer\",\"t10\":\"U. Sudhir Lodha\",\"td10\":\"Educationist\",\"t11\":\"G. Sundar\",\"td11\":\"(Founder Trustee), Archivist\",\"t12\":\"S. Theodore Baskaran\",\"td12\":\"(Founder Trustee), Film Historian, Author\",\"t13\":\"Urvashi Butalia\",\"td13\":\"Author, Publisher\",\"tsd\":\"Santhi Duraisamy\",\"tsdabt\":\"Entrepreneur\",\"directors\":\"Directors\",\"d1\":\"Dr. G. Sundar, Since 2005\",\"d2\":\"S. Theodore Baskaran, 1998-2001\",\"d3\":\"P. Sankaralingam (Late), 1994-1997\",\"hod\":\"Heads of Departments\",\"hod1\":\"R. Balakrishnan, Honorary Consultant, Indus Research Centre\",\"hod2\":\"A. S. Panneerselvan, Fellow, Centre for Study in Public Sphere\",\"hod3\":\"R. Vijayasankar, Director, Research \u0026 Publications\",\"hod4\":\"R. Prakash, Centre for Cataloguing and Preservation\",\"staff\":\"Staff\",\"sm\":\"S. Muthu Malathi, Assistant Director\",\"ms\":\"M. Manikanda Subbu, Assistant Director\",\"ekm\":\"E. K. Mohan, Senior Technical Assistant, Conservation\",\"satya\":\"A. Sathyamurthy, Senior Technical Assistant, Reprographics\",\"mr\":\"M. Ravi, Senior Technical Assistant, Reprographics\",\"naresh\":\"C. Naresh, Technical Assistant, Reprographics\",\"thangam\":\"K. Thangam, Technical Assistant, Reference Services\",\"sd\":\"Dr. Se. Dhanapal, Research Assistant\",\"rr\":\"Ranjith Roozo, Technical Officer\",\"consultants\":\"Consultants\",\"gandhi\":\"B. Gandhi\",\"mn\":\"Muthu Nedumaran\",\"pres_head\":\"Cataloguing \u0026 Preservation\",\"pres_sh1\":\"Cataloguing\",\"pres_p1\":\"RMRL has been documenting all available and accessible Tamil resources in MARC21 format. It has been contributing catalogue records to the South Asian Union Catalogue and WorldCat. RMRL has indexed 1,60,000 articles from Tamil periodicals on literature, indigenous medicine, religion, folklore, popular culture, metaphysics, Gandhian studies, gender studies, and modern history. It has developed a Union Catalogue of all public libraries in the State with the support of the Government of Tamil Nadu. The library has also Indexed private collections of eminent personalities and institutions in India. RMRL has catalogued and indexed several collections, including some of the books in University of Texas, University of Chicago, Cambridge University, Bodelien Library and a few private collections.\",\"pres_sh2\":\"Preservation\",\"pres_p2\":\"A crucial element of RMRL’s vision is the preservation of its collection for posterity. One of the main aspects that RMRL focuses on is the preservation of existing material in alternative formats. RMRL preserves its collection systematically through archival microfilming and digitisation. While microfilming has been discontinued as the preferred mode of preservation is through digitization, RMRL has been using various equipment to preserve its material through digitization. It uses state of the art equipment for this purpose. A facility with an exclusive storage to preserve microfilms round-the-clock under 35% relative humidity and 18° Celsius is in place. International best practices like the Methylene Blue Test were performed to determine the archival quality of microfilms processed at RMRL. RMRL is also involved in the digital restoration of manuscripts. The restoration of the Notebooks of Srinivasa Ramanujan and the first edition of Thirukkural is a testimony to its expertise in this field.\",\"pres_sh3\":\"Paper Conservation\",\"pres_p3\":\"In 2015, RMRL set up a full-fledged Conservation Studio with financial assistance from the Tata Trust to physically conserve its collection of rare papers that are damaged. RMRL has developed conservation methodologies, suitable for tropical climates. It has conserved around one lakh pages of rare Tamil books and periodicals. Its ‘Adopt A Book’ programme collaborates with patrons who want to conserve a book of their choice. It costs INR 5000/- to conserve a book (This is an average cost, which would vary according to the number of pages.) Individuals and corporates have come forward to join us in this cause. As of September 2024, 2000 books have been adopted. RMRL is also a consultant to several premier institutions in South Asia in the area of preservation and conservation. RMRL is also a consultant to several premier institutions in South Asia in the area of preservation and conservation.\",\"irc_head\":\"Indus Research Centre \",\"irc_p1\":\"The Indus Research Centre (IRC) undertakes scientific investigations into the various aspects of the Harappan or Indus Valley Civilisation, particularly the Indus Script, which remains undeciphered. It was started in 2007 under the guidance of Padma Shri Iravatham Mahadevan. He was its first honorary consultant. After he stepped down, R. Balakrishnan serves as its honorary consultant.\",\"irc_p2\":\"The IRC has collaborated with the Tata Institute of Fundamental Research, Mumbai, the Institute of Mathematical Sciences, Chennai, and premier institutions around the world such as University of Washington, Seattle. The IRC publishes an annual bulletin. It has converted Iravatham Mahadevan’s Indus Concordance (1977) into a web application. Available at indusscript.in, it serves as an open online tool for Indus scholars and interested individuals to analyse and interpret the script. The IRC is open to all bona fide scholars who wish to undertake research in this field.\",\"irc_p3\":\"The IRC is planning to hold an international conference in association with the Department of Archaeology, Government of Tamil Nadu. For more information see \",\"indus100\":\"indus100.com\",\"irc_p4\":\"For the papers of Iravatham Mahadevan and R. Balakrishnan, please access our digital library.\",\"irc_quote1\":\"‘Journey of a Civilization: Indus to Vaigai’ grapples with a little -  understood period in Indian History - the centuries that followed the decline of the Indus Valley Civilisation.\",\"irc_by1\":\"— Tony Joseph, author of ‘Early Indians’\",\"irc_quote2\":\"RMRL published Balakrishnan’s magnum opus Journey of a Civilization: Indus to Vaigai, in 2019. This book seeks to establish common grounds and connecting threads that link the riddles of Indology, namely the language of the Indus Valley Civilisation and the origins of Dravidian language-speaking people, particularly those of the old Tamil traditions.\",\"csps_head\":\"Centre for Study in Public Sphere\",\"csps_content\":\"Centre for Study in Public Sphere (CSPS) explores contemporary aspects of culture and modernity. It aims to map the journey of Tamil Nadu by bringing out a series of biographies that capture the nodal moments in which the State took a turn for the better to retain its unique language, culture and civilisational norms.\",\"collections\":\"Collections\",\"col_h\":\"Since its inception in 1994, RMRL has acquired a comprehensive collection of literature and other material that are of great significance to scholars of South Indian studies, particularly Tamil studies.\",\"col_content\":\"These collections attract hundreds of scholars from around the world. Keeping the Roja Muthiah’s original treasure as the nucleus, RMRL has added several donors collections to its stacks. Donors consider that their collection would be safely preserved by RMRL and be put to good use by scholars.\",\"col_st1\":\"Some of its significant collections are:\",\"c1\":\"Mu. Arunachalam's collection - rare books related to Tamil literature and grammar\",\"c2\":\"A. K. Ramanujan's collection - books related to ancient and modern Tamil literature\",\"c3\":\"T. P. Meenakshisundaram's collection - books related to Tamil language and literature.\",\"c4\":\"Sa. Kandasamy's collection - books related to Tamil literature, little magazines and periodicals\",\"c5\":\"Sivasankari's collection - Modern literature, audio tapes and photographs\",\"c6\":\"S. Muthiah's collection - Books related to the history of Madras\",\"format\":\"Formats\",\"f1\":\"Paper material such as books, periodicals, newspapers, official publications in Tamil and English\",\"f2\":\"Palm leaf manuscripts\",\"f3\":\"Gramophone records, spool tapes, audio cassettes, CDs, DVDs\",\"f4\":\"Ephemeral items like postcards, invitations, pamphlets, press clippings, drama notices, calendars\",\"f5\":\"Other visual materials such as photographs, slides, negatives, glass negatives\",\"f6\":\"Cinema posters, prints of oleo lithographs from Ravi Varma’s workshop\",\"f7\":\"2500 Microfilm reels and 2 million page digital images.\",\"subjects\":\"Subjects\",\"s1\":\"Classical Tamil literature, medieval and modern Tamil literature, literary criticism\",\"s2\":\"Folklore - folk dramas and stories, Gujili songs, Sindhu literature\",\"s3\":\"Indigenous medicine - All publications on Siddha, Ayurveda and veterinary science\",\"s4\":\"Popular culture - Theatre related material, early cinema periodicals, research books, cinema song books, cinema posters\",\"s5\":\"Political \u0026 social movements - Books and periodicals related to early Tamil Nadu politics, particularly the Self-Respect Movement, the Dravidian movement, the Communist movement, the movement against imposition of Hindi\",\"s6\":\"Gender studies\",\"s7\":\"Religion and Philosophy, Dalit studies\",\"s8\":\"Civilizational Studies including Indus Valley Civilization\",\"s9\":\"History and archaeology\",\"pub_head\":\"Publications\",\"pub_content\":\"RMRL started publishing since 2019 with Journey of a Civlization: Indus to Vaigai as its first work. A Tamil version of the book was published in 2023 which was released by the Hon’ble Chief Minister for Tamil Nadu. The first classical text in Tamil that went on print in 1812, Tirukkural was reprinted as a fascimile reproduction. It is being considered as a collectors edition. RMRL in collaboration with Speaking Tigers published the thesis of Yoshitaka Terada, an ethno-musicologist on T.N. Rajarattinam Pillai. RMRL will undertake very important works that is pertinent to Tamil culture and research works that are done at the centre.\",\"vol_h\":\"Volunteering\",\"vol_content\":\"Many people volunteer at RMRL. Depending on their skills, works such as coding, listing, sorting, indexing are allotted to volunteers. Their contribution is acknowledged. If you are interested, please write to rmrl@rmrl.in\",\"donation_head\":\"Donation\",\"donation_p1\":\"The journey of RMRL over the last thirty years has been made possible by the support of several institutional grants, philanthropists, Corporate Social Responsibility programmes, and donations of individuals.\",\"donation_p2\":\"Donations to RMRL Trust are 50% tax exempted under section 80G of Income Tax Act. Donations towards building fund can be made through cheque, online transfers or through the link below.\",\"donation_p3\":\"For online donation click here\",\"donation_p4\":\"(On clicking the above link you will be redirected to State Bank's SB Collect portal. Kindly fill the details to make donations. The details you enter will be kept strictly confidential and not be shared with anyone.)\",\"donation_p5\":\"Once the online transaction is completed, we will send you a personalized acknowledgment letter to your address along with a receipt. Form 10BD, which will be used for your income tax deduction purposes, will be shared with you by the month of May (as soon as the IT department releases) of the following year.\",\"visit_head\":\"Visit the Library\",\"visit_p1\":\"In our reference library, you can sit with the reading material of your choice in the designated area. If you wish to search our collection for any material you need, you may provide your queries at the reference desk or use our offline catalogue. The reference staff will bring the required material to your table. If you are a first-time user, you will be required to fill an online user form. You will be given a user number. There is also a book stack with dictionaries, encyclopedias, reference books and coffee table books in the reference area which you are free to access directly. You may also browse these books while you are waiting to meet the reference person\",\"visit_add\":\"Address\",\"visit_add1\":\"4th floor, Integrated Workshop Building,\",\"visit_add2\":\"3rd cross road, CPT Campus,\",\"visit_add3\":\"Taramani, Chennai 600113\",\"reach\":\"To reach the library\",\"reach_1\":\"Situated opp. to Indra Nagar Railway station\",\"reach_2\":\"14 kms from the airport\",\"reach_3\":\"14 kms from the MGR Central Railway Station\",\"reach_4\":\"31 kms from the Kilambakkam new bus stand\",\"visit_h1\":\"Accessing material\",\"visit_h2\":\"Touring the library\",\"visit_p2\":\"RMRL showcases several aspects of Tamil civilization. The major activities are digitization, book conservation and research. Those who wish to take a tour of the library may contact our staff. You may fix an appointment and visit the library. Contact: +91 44 22542551\",\"visit_h3\":\"Cafetaria\",\"visit_p3\":\"A cafeteria is available with modest facilities for the staff. Visitors will be served coffee/tea on payment. They can bring their own food and eat at the dining area. The nearest restaurants are A2B and Sangeetha in Adyar; Hot Chips in Sri Ram Nagar. The M.S. Swaminathan Foundation, which is opposite our premises, has its own canteen.\",\"mail1\":\"Join our mailing list\",\"mail2\":\"By joining you will receive our newsletters and updates about our events\",\"mail3\":\"Join\",\"mail4\":\"email\",\"follow\":\"Connect with us\",\"thanks\":\"Thank you for subscribing!\",\"books\":\"Books\",\"periodicals\":\"Periodicals\",\"videos\":\"Videos\",\"sc\":\"Search Catalogue\",\"sr\":\"Search Results\",\"op\":\"Official Publications\",\"personal\":\"Personal Collections\",\"researchpapers\":\"Research Papers\",\"gw\":\"Gateway\",\"op-desc\":\"Official publications are reports published during British India by the British. There were several departments such as Education, Health, Public Works, Administration, Police, Agriculture and others. Each department published their yearly reports. These reports can be found in the State Archives, National Archives of India, the British Library and a few other prominent archives/libraries. There is a modest collection of these reports in RMRL donated by the University of Chicago. They have been digitized and now being made available through this portal. The work is in progress and the digitized material will be uploaded/ingested to the portal in batches once every month.\",\"VD\":\"Prof. Vasanthi Devi Archive\",\"VD-Desc\":\"Dr. Vasanthi Devi (1938-) is a renowned academic, former vice chancellor of the Manonmaniam Sundaranar University (1992–1998) and as the chairperson of the State commission for Women in Tamil Nadu (2002-2005). She actively engaged in discussions at both the state and national levels, advocating for reforms that incorporate feminist perspectives into social and political frameworks. She is the president of the movement, which has set up branches all over the state \u0026 in most districts. She, along with a group of concerned friends, started a movement for strengthening school education in Tamil Nadu in 2017, called Palli Kalvi Pathukappu Iyakkam ( Movement for saving school education).  Her personal archives contain newspaper clippings, papers and correspondences.\",\"IMnotes\":\"Iravatham Mahadevan Notebooks\",\"IMnotes-Desc\":\"Iravatham Mahadevan in his lifetime worked on two areas namely the Indus script and Tamil Brahmi script. He brought out two compendiums - the Indus Concordance and the compilation of Tamil Brahmi script which was first published in the Harvard Oriental Series and later by Central Institute for Classical Tamil. The Indus Concordance has been digitized and can be accessed through indusscript.in. Mahadevan, in his lifetime published a number papers and articles. Apart from the published items, he has his working notebooks which he called “Gnanodayam”. They have been digitized and made available through this portal.\",\"ashamanivannan\":\"Asha Manivannan \u0026 Mani Manivannan Collection\",\"ashamanivannan-desc\":\"In 2016, Mrs. Asha and Mr. Manivannan handed over a number of palm leaf manuscripts that belonged to their family. They have been digized and now being made available through this portal. The collection has material related to religion, medicine, astrology.\",\"susan\":\"Prof. Susan Seizer Collection\",\"susan-desc\":\"$13\",\"bkspeech\":\"R. Balakrishnan speeches\",\"bkspeech-desc\":\"In this archive check out the speeches of R. Balakrishnan related to Sangam literature and Indus Valley Civilization.\",\"viewcollection\":\"View Collection\",\"impapers\":\"Iravatham Mahadevan papers\",\"bkpapers\":\"R. Balakrishnan papers\",\"vaayil\":\"Gateway to Tamil \u0026 Tamil related Online Resources\",\"tkc-banner\":\"About Tamil Knowledge Campus\",\"tkc-para1\":\"In addition to the library activities, preservation, museum and the research centres, the TKC has formed a Tamil Knowledge Campus Development Federation. This federation will undertake the following activities.\",\"tkc-h1\":\"Activities of the Tamil Knowledge Campus Development Federation\",\"tkc-h1p1\":\"The Federation engages in activities related to Tamil culture, heritage, and arts.\",\"tkc-h1p2\":\"It collects, preserves and documents books, artworks, and antiquities. It also facilitates new research, provides guidance, and disseminates knowledge.\",\"tkc-h1p3\":\" It organizes seminars, workshops, exhibitions, training programs, educational initiatives, and activities related to art, either independently or in collaboration with other institutions.\",\"tkc-h1p4\":\"The Federation also focuses on documenting and digitizing material related to Tamil and its heritage in other countries. It encourages research scholars by training them in new technologies and supporting research initiatives.\",\"tkc-h1p5\":\"It promotes new research in fields such as archaeology, history, Tamil computing, linguistics, folklore, and literary studies.\",\"tkc-h1p6\":\"The Federation shall undertake teaching of the Tamil language, encourages science education in Tamil, and other activities related to the Tamil language and culture.\",\"tkc-h1p7\":\"Acting as a bridge between the Tamil diaspora and the Tamils in India, the Federation strives to showcase Tamil culture on the global stage, highlight Tamil intellectual heritage at the international level, and reinforce the global presence of Tamil identity.\",\"tkc-h2\":\"Federation’s Structure\",\"tkc-h2p1\":\"The federation ensures that all the members actively participate in its activities with enthusiasm, operate with a broad vision, and take pride in considering the federation as their prestigious identity.\",\"tkc-h2p2\":\"As the federation is established as a non-political organization, direct participation of politicians as members will be avoided.\",\"tkc-h2p3\":\"A coordinator will be appointed for each country. The number of coordinators will be determined on the basis of population in each country and their activities therein.\",\"tkc-h2p4\":\"\",\"archaeology-bh\":\"Journal of Archaeology and Culture\",\"archaeology-tit1\":\"Tholthadam \",\"archaeology-tit2\":\" Archaeology and Cultural Studies e-Journal\",\"archaeology-greeting\":\"Greetings to All,\",\"archaeology-para1\":\"In the evolving context of a new perspective emerging in the writing of the history of the Indian subcontinent from the south, it is our responsibility to bring the archaeological and cultural-related issues taking place in Tamil Nadu to a broader audience. As part of this initiative, the Tamil Nadu Archaeology Department and the Roja Muthiah Research Library have planned to launch an e-journal focused on archaeology and cultural studies. This e-journal will be published three times a year. We invite contributions from scholars, professors, researchers, research students, and history enthusiasts from across Tamil Nadu.\",\"archaeology-para2\":\"We are expecting articles on the following topics for this e-journal :\",\"archaeology-point1\":\"Ancient History and Archaeology\",\"archaeology-point2\":\"Maritime Archaeology and History\",\"archaeology-point3\":\"New Archaeological Discoveries\",\"archaeology-point4\":\"Epigraphy\",\"archaeology-point5\":\"Temple Architecture, Sculpture, and Painting\",\"archaeology-point6\":\"Ancient History (Rock Paintings, Stone Inscriptions, Cultural Symbols)\",\"archaeology-point7\":\"Articles related to the study, preservation, and restoration of historical symbols, historical documents, and artifacts using modern technology\",\"archaeology-point8\":\"Numismatics\",\"archaeology-point9\":\"Ancient Literature, Culture, and History\",\"archaeology-point10\":\"Archaeology and Related Disciplines (Anthropology, Folklore, Linguistics, Genetics, Geography, and other scientific fields)\",\"archaeology-point11\":\"Reviews and Introductions of Books on Archaeology and Cultural Studies\",\"archaeology-para3\":\"The articles submitted must adhere to the following guidelines :\",\"archaeology-point12\":\"Articles can be written in Tamil or English.\",\"archaeology-point13\":\"Articles must be submitted in MS Word, Unicode format.\",\"archaeology-point14\":\"Articles should be between 800 and 1200 words or a maximum of 4 A4 pages.\",\"archaeology-point15\":\"Citations and references should be placed at the end of the article and follow the Chicago Manual of Style.\",\"archaeology-point16\":\"If the article includes any images, proper credits for those images must be provided. Images should be at least 300 DPI.\",\"archaeology-point17\":\"Articles must not have been previously published.\",\"archaeology-point18\":\"Any form of plagiarism will lead to rejection.\",\"archaeology-point19\":\"Articles related to new discoveries will only be published after being reviewed and approved by the research committee.\",\"archaeology-point20\":\"Authors should include a passport-sized photo, a brief bio, email address, and contact number along with their article.\",\"archaeology-point21\":\"The editorial team reserves the right to edit and shorten articles.\",\"archaeology-para4\":\"Those wishing to submit articles for this journal are requested to send them to XXXXXXXX email address by January 31st.\",\"archaeology-para5\":\"Thank you,\",\"archaeology-editors\":\"Editors\",\"archaeology-editors1\":\"Dr. Sundar Ganeshan\",\"archaeology-editors2\":\"Dr. Sivanandam\",\"archaeology-editors3\":\"EMr. Gandhi Balasubramaniyan\",\"archaeology-journal\":\"Journal Publication\",\"archaeology-journal1\":\"Tamil Nadu Archaeology Department\",\"archaeology-journal2\":\"Roja Muthiah Research Library\",\"news-letter-col1-bh\":\"RMRL NewsLetter\",\"news-letter-jan25-h\":\"January 2025\",\"news-letter-col1-p\":\"Mr . Lakshmi Narayanan\",\"news-letter-dec24-h\":\"December 2024\",\"news-letter-feb25-h\":\"February 2025\",\"news-letter-mar25-h\":\"March 2025\",\"news-letter-aprl25-h\":\"April 2025\",\"news-letter-may25-h\":\"May 2025\",\"news-letter-jun25-h\":\"June 2025\",\"news-letter-jul25-h\":\"July 2025\",\"jan\":\"January\",\"feb\":\"February\",\"mar\":\"March\",\"apr\":\"April\",\"may\":\"May\",\"jun\":\"June\",\"jul\":\"July\",\"aug\":\"August\",\"sep\":\"September\",\"oct\":\"October\",\"nov\":\"November\",\"dec\":\"December\",\"journal-col1-h\":\"தொல்தடம் ஆய்விதழ் அறிவிப்பு\",\"event_content\":\"Please check this page for forthcoming events .\",\"upcoming_events\":\"Upcoming Events\",\"chol_home\":\"Home\",\"chol_archive\":\"Archive\",\"chol_glossary\":\"Glossary\",\"chol_events\":\"Events\",\"chol_subscri_btn\":\"Subscribe\",\"chol_submit\":\"Submitting... \",\"chol_subscri_model_head\":\"Subscribe\",\"chol_subscri_model_para\":\"Stay updated with our latest news, articles, and events by subscribing to our newsletter. Enter your email address below to receive regular updates.\",\"chol_archive_explore\":\"Explore Archives\",\"chol_page_perData\":\"Items per page\",\"share\":\"Share\",\"share_post\":\"Share this post\",\"date\":\"Date\",\"time\":\"Time\",\"place\":\"Venue\",\"homeScreen_tkc_title\":\"Tamil Knowledge Campus\",\"homeScreen_tkc_subtitle\":\"An Appeal for Support\",\"homeScreen_tkc_para\":\"In constructing this campus, it would cost Rs.5000 per square  feet including the interiors. Choose the number of square feet, you would like to support and find a place in History!\",\"homeScreen_tkc_btn1\":\"To Donate\",\"homeScreen_tkc_btn2\":\"Brochure\",\"homeScreen_donate_title\":\"Thank you for your contribution to the Tamil Knowledge Campus.\",\"homeScreen_donate_sutitle\":\"To contribute via UPI\",\"homeScreen_donate_bold1\":\"\",\"homeScreen_donate_para1\":\"You can contribute through the UPI ID rojamuthiahtrust@sbi, or by scanning the QR code given below.\",\"homeScreen_donate_bold2\":\"Bank Account Details (NEFT/IMPS):\",\"homeScreen_donate_bold3\":\"To contribute via cheque\",\"homeScreen_donate_para2\":\"Please issue the cheque in favour of “Roja Muthiah Research Library Trust – Building Fund” and send it to our address.\",\"homeScreen_donate_para3\":\"For further details, please contact 8015312686\",\"homeScreen_donate_bold4\":\"If sending from a US bank account:\",\"view_btn\":\"More\",\"tholthadam_name\":\"Thol Thadam\",\"tholthadam_sub\":\"Archaeology and Cultural Journal\",\"jois_name\":\"Journal of Indus Studies\",\"jois_sub\":\"Archaeology and Indus Studies\",\"tholthadam_sub_logo1\":\"Joint publication from Tamil Nadu State Dept. of Archaeology and RMRL\",\"btn_tholthdam\":\"Visit Thol Thadam Journal Site\",\"fontstudio_banner\":\"Tamil Font Studio\",\"fontstudio_para1\":\"RMRL Tamil Font Studio is an initiative created by the RMRL Trust with funding from Onemai Foundation. It is a two-year project to create and celebrate Tamil typefaces. With the mentorship of leading Tamil Typeface designer Muthu Nedumaran, the TFS team explores areas of font-making that incorporate Tamil ethos and writing methods. The focus will be on developing fonts/typefaces scientifically and aesthetically, meeting international standards.\",\"fontstudio_para2\":\"The Studio has planned to research old typefaces from the RMRL archives - print (magazine covers and books), legacy handwriting fonts (handwritten journals and correspondences), and create new fonts. RMRL and Onemai will make these fonts available to the public under the SIL Open Font License.\",\"fontstudio_para3\":\"TFS aims to preserve and innovate by researching and identifying trailblazing typographical work from the past and transforming it into digital fonts for contemporary use. This is to keep abreast of the latest global trends and technologies in typography and adapt them to suit Tamil ethos.\",\"fontstudio_para4\":\"RMRL Tamil Font Studio has conducted two seminars and workshops in the past to encourage designers to create Tamil fonts and fontmakers in Tamil Nadu.\",\"fontstudio_para5\":\"Tamil Font Studio is launching its first Tamil font on 19th December 2025.\",\"fontstudio_download\":\"Download Fonts\"},\"children\":\"$L14\"}]\n"])</script>
